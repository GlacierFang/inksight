<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPUB 阅读器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f5f5f5;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #333;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #header {
    background: #fff;
    border-bottom: 1px solid #ddd;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }
  #header a {
    color: #1890ff;
    text-decoration: none;
    font-size: 14px;
  }
  #header a:hover { text-decoration: underline; }
  #title {
    font-size: 16px;
    font-weight: 600;
    flex: 1;
    text-align: center;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #content {
    flex: 1;
    overflow-y: auto;
    background: #fff;
    padding: 30px 40px;
    max-width: 900px;
    margin: 0 auto;
    width: 100%;
    line-height: 1.8;
    font-size: 16px;
  }
  #content img {
    max-width: 100%;
    height: auto;
  }
  #nav {
    background: #fff;
    border-top: 1px solid #ddd;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  #nav button {
    padding: 8px 20px;
    background: #1890ff;
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
  }
  #nav button:disabled {
    background: #ccc;
    cursor: not-allowed;
  }
  #progress {
    font-size: 13px;
    color: #666;
  }
  .loading {
    text-align: center;
    padding: 60px;
    color: #999;
    font-size: 15px;
  }
  .error {
    text-align: center;
    padding: 60px;
    color: #ff4d4f;
    font-size: 15px;
  }
</style>
</head>
<body>

<div id="header">
  <a href="/library/">← 书架</a>
  <div id="title">加载中...</div>
</div>

<div id="content">
  <div class="loading">正在加载书籍信息...</div>
</div>

<div id="nav">
  <button id="prevBtn" onclick="prevChapter()" disabled>上一章</button>
  <span id="progress">0 / 0</span>
  <button id="nextBtn" onclick="nextChapter()" disabled>下一章</button>
</div>

<script>
const docId = window.location.pathname.split('/').pop();
let currentChapter = 0;
let totalChapters = 0;
let spine = [];

async function loadSpine() {
  try {
    const resp = await fetch(`/library/api/epub/spine/${docId}`);
    const data = await resp.json();
    if (data.error) {
      showError(data.error);
      return;
    }
    document.getElementById('title').textContent = data.title || 'EPUB 阅读器';
    spine = data.chapters;
    totalChapters = data.total;
    document.getElementById('progress').textContent = `${currentChapter + 1} / ${totalChapters}`;
    updateButtons();
    loadChapter(0);
  } catch (e) {
    showError('加载目录失败: ' + e.message);
  }
}

async function loadChapter(idx) {
  if (idx < 0 || idx >= totalChapters) return;
  currentChapter = idx;
  document.getElementById('content').innerHTML = '<div class="loading">正在加载章节...</div>';
  document.getElementById('progress').textContent = `${currentChapter + 1} / ${totalChapters}`;
  updateButtons();

  try {
    const resp = await fetch(`/library/api/epub/chapter/${docId}/${idx}`);
    const data = await resp.json();
    if (data.error) {
      showError(data.error);
      return;
    }
    // 注入内容，添加基础样式
    const content = data.content;
    const styled = injectStyles(content);
    document.getElementById('content').innerHTML = styled;
    window.scrollTo(0, 0);
  } catch (e) {
    showError('加载章节失败: ' + e.message);
  }
}

function injectStyles(html) {
  // 移除原有的 head 内容，注入我们的样式
  return html.replace(/<head>[\s\S]*?<\/head>/, `<head>
    <meta charset="UTF-8">
    <style>
      body {
        font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        line-height: 1.8;
        padding: 0;
        margin: 0;
        color: #333;
      }
      p { margin: 0.8em 0; text-indent: 2em; }
      img { max-width: 100%; height: auto; }
      h1, h2, h3 { margin: 1em 0 0.5em; font-weight: 600; }
      table { border-collapse: collapse; width: 100%; margin: 1em 0; }
      td, th { border: 1px solid #ddd; padding: 6px 10px; }
      blockquote { margin: 1em 0; padding: 0.5em 1em; border-left: 3px solid #ddd; color: #666; }
      pre, code { background: #f5f5f5; padding: 0.2em 0.4em; border-radius: 3px; font-size: 0.9em; }
      pre { padding: 1em; overflow-x: auto; }
    </style>
  </head>`);
}

function prevChapter() {
  loadChapter(currentChapter - 1);
}

function nextChapter() {
  loadChapter(currentChapter + 1);
}

function updateButtons() {
  document.getElementById('prevBtn').disabled = currentChapter <= 0;
  document.getElementById('nextBtn').disabled = currentChapter >= totalChapters - 1;
}

function showError(msg) {
  document.getElementById('content').innerHTML = `<div class="error">${msg}</div>`;
}

// 键盘快捷键
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') prevChapter();
  if (e.key === 'ArrowRight') nextChapter();
});

loadSpine();
</script>
</body>
</html>
