<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPUB 阅读器</title>
    <script src="/library/static/epub.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .toolbar { height: 50px; background: #1a1a1a; border-bottom: 1px solid #333; display: flex; align-items: center; gap: 12px; padding: 0 16px; }
        .back-btn { background: #2d2d2d; border: none; color: #fff; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .back-btn:hover { background: #3d3d3d; }
        .book-title { flex: 1; font-size: 14px; color: #888; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .font-btn, .theme-btn { background: #2d2d2d; border: none; color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; min-width: 40px; }
        .font-btn:hover, .theme-btn:hover { background: #3d3d3d; }
        .toc-btn { background: #2d2d2d; border: none; color: #fff; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .toc-btn:hover { background: #3d3d3d; }
        .progress-bar { width: 100px; height: 4px; background: #333; border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; background: #07c160; width: 0%; transition: width 0.3s; }
        .progress-text { font-size: 12px; color: #666; min-width: 40px; }
        #reader { width: 100%; height: calc(100vh - 50px); }
        .toc-overlay { position: fixed; top: 0; right: -350px; width: 350px; height: 100vh; background: #1a1a1a; border-left: 1px solid #333; transition: right 0.3s; z-index: 100; overflow-y: auto; }
        .toc-overlay.open { right: 0; }
        .toc-header { padding: 16px; border-bottom: 1px solid #333; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        .toc-close { background: none; border: none; color: #888; font-size: 20px; cursor: pointer; }
        .toc-list { padding: 8px; }
        .toc-item { padding: 10px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; color: #aaa; }
        .toc-item:hover { background: #2d2d2d; color: #fff; }
        .toc-item.active { background: #07c160; color: #fff; }
        .toc-item.sub { padding-left: 24px; font-size: 12px; }
        .loading { display: flex; align-items: center; justify-content: center; height: 100%; color: #666; flex-direction: column; gap: 12px; }
        .loading-spinner { width: 40px; height: 40px; border: 3px solid #333; border-top-color: #07c160; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error { display: flex; align-items: center; justify-content: center; height: 100%; color: #e74c3c; flex-direction: column; gap: 12px; }
    </style>
</head>
<body>
    <div class="toolbar">
        <button class="back-btn" onclick="history.back()">← 返回</button>
        <span class="book-title" id="bookTitle">加载中...</span>
        <button class="toc-btn" onclick="toggleTOC()">目录</button>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <span class="progress-text" id="progressText">0%</span>
        <button class="font-btn" onclick="changeFontSize(-1)" title="字号-">A-</button>
        <button class="font-btn" onclick="changeFontSize(1)" title="字号+">A+</button>
        <button class="theme-btn" onclick="toggleTheme()" title="切换主题">☀</button>
    </div>

    <div id="reader">
        <div class="loading">
            <div class="loading-spinner"></div>
            <div>正在加载书籍...</div>
        </div>
    </div>

    <div class="toc-overlay" id="tocOverlay">
        <div class="toc-header">
            <span>目录</span>
            <button class="toc-close" onclick="toggleTOC()">×</button>
        </div>
        <div class="toc-list" id="tocList"></div>
    </div>

    <script>
        const bookId = window.location.pathname.split('/').pop();
        let book = null;
        let rendition = null;
        let fontSize = 16;
        let currentTheme = 'dark';

        const themes = {
            dark: { bg: '#1a1a1a', text: '#e0e0e0' },
            sepia: { bg: '#f4ecd8', text: '#5b4636' },
            light: { bg: '#ffffff', text: '#222222' }
        };

        function init() {
            const container = document.getElementById('reader');

            book = ePub(`/library/epub/${bookId}/`);
            rendition = book.renderTo(container, {
                width: '100%',
                height: 'calc(100vh - 50px)',
                spread: 'auto'
            });

            rendition.display();

            // 等待书籍加载
            book.loaded.navigation.then(toc => {
                renderTOC(toc);
            });

            book.ready.then(() => {
                document.getElementById('bookTitle').textContent = book.package.metadata.title || '未命名书籍';
            });

            // 翻页进度
            rendition.on('relocated', location => {
                const total = book.locations.length;
                if (total === 0) return;
                const progress = Math.round((location.start.location / total) * 100);
                document.getElementById('progressFill').style.width = progress + '%';
                document.getElementById('progressText').textContent = progress + '%';
            });

            // 键盘翻页
            document.addEventListener('keydown', e => {
                if (e.key === 'ArrowRight' || e.key === ' ') rendition.next();
                if (e.key === 'ArrowLeft') rendition.prev();
            });

            // 触屏滑动
            let startX = 0;
            container.addEventListener('touchstart', e => { startX = e.touches[0].clientX; });
            container.addEventListener('touchend', e => {
                const diff = startX - e.changedTouches[0].clientX;
                if (Math.abs(diff) > 50) {
                    diff > 0 ? rendition.next() : rendition.prev();
                }
            });
        }

        function renderTOC(toc) {
            const list = document.getElementById('tocList');
            list.innerHTML = '';

            function addItems(items, level = 0) {
                items.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'toc-item' + (level > 0 ? ' sub' : '');
                    div.textContent = item.label;
                    div.onclick = () => {
                        rendition.display(item.href);
                        if (window.innerWidth < 768) toggleTOC();
                    };
                    list.appendChild(div);
                    if (item.subitems && item.subitems.length > 0) {
                        addItems(item.subitems, level + 1);
                    }
                });
            }

            addItems(toc);
        }

        function toggleTOC() {
            document.getElementById('tocOverlay').classList.toggle('open');
        }

        function changeFontSize(delta) {
            fontSize = Math.max(12, Math.min(28, fontSize + delta * 2));
            if (rendition) {
                rendition.themes.fontSize(fontSize + 'px');
            }
        }

        function toggleTheme() {
            const keys = Object.keys(themes);
            const idx = keys.indexOf(currentTheme);
            currentTheme = keys[(idx + 1) % keys.length];
            const theme = themes[currentTheme];
            if (rendition) {
                rendition.themes.override('body', {
                    'background-color': theme.bg,
                    'color': theme.text
                });
            }
            document.querySelector('.theme-btn').textContent = currentTheme === 'dark' ? '☀' : (currentTheme === 'sepia' ? '🌙' : '☀');
        }

        init();
    </script>
</body>
</html>
