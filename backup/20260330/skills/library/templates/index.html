<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人电子书库</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f0f; color: #fff; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header { display: flex; align-items: center; justify-content: space-between; padding: 20px 0; border-bottom: 1px solid #222; margin-bottom: 24px; }
        .header h1 { font-size: 22px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .upload-btn { background: #07c160; border: none; color: #fff; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; }
        .upload-btn:hover { background: #06a554; }
        .filters { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
        .filter-select { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 13px; min-width: 120px; }
        .search-input { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 13px; flex: 1; max-width: 300px; }
        .stats { font-size: 13px; color: #666; margin-left: auto; }
        .nav { display: flex; gap: 8px; margin-bottom: 24px; }
        .nav a { padding: 8px 16px; background: #1a1a1a; border-radius: 8px; color: #888; text-decoration: none; font-size: 14px; }
        .nav a:hover { background: #2d2d2d; }
        .nav a.active { background: #07c160; color: #fff; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
        .book-card { background: #1a1a1a; border-radius: 12px; padding: 16px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; border: 1px solid #2a2a2a; }
        .book-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
        .book-icon { font-size: 40px; margin-bottom: 12px; }
        .book-name { font-size: 14px; font-weight: 500; margin-bottom: 8px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; min-height: 40px; }
        .book-meta { font-size: 12px; color: #666; display: flex; flex-direction: column; gap: 4px; }
        .book-category { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; margin-top: 8px; background: #333; color: #aaa; }
        .book-category.pending { background: #3d2e1a; color: #f39c12; }
        .book-category.indexed { background: #1a3d2e; color: #27ae60; }
        .book-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
        .tag { display: inline-block; padding: 2px 8px; background: #2d2d2d; border-radius: 4px; font-size: 11px; color: #888; }
        .chunk-badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; margin-top: 4px; }
        .chunk-badge.pending { background: #2d2d3d; color: #888; }
        .chunk-badge.processing { background: #3d2e1a; color: #f39c12; }
        .chunk-badge.ready { background: #1a3d2e; color: #27ae60; }
        .chunk-btn { width: 100%; margin-top: 10px; padding: 6px; background: #2d2d2d; border: none; border-radius: 6px; color: #aaa; font-size: 12px; cursor: pointer; }
        .chunk-btn:hover:not(:disabled) { background: #3d3d3d; color: #fff; }
        .chunk-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .empty { text-align: center; padding: 80px 20px; color: #444; }
        .empty-icon { font-size: 60px; margin-bottom: 16px; }
        .empty-text { font-size: 16px; margin-bottom: 8px; }
        .empty-hint { font-size: 13px; color: #333; }
        .loading { text-align: center; padding: 60px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 个人电子书库</h1>
            <button class="upload-btn" onclick="location.href='/library/upload'">+ 上传文档</button>
        </div>

        <div class="nav">
            <a href="/library/" class="active">📚 资料库</a>
            <a href="/library/upload">⬆️ 上传</a>
        </div>

        <div class="filters">
            <select class="filter-select" id="categoryFilter">
                <option value="">全部分类</option>
            </select>
            <select class="filter-select" id="tagFilter">
                <option value="">全部标签</option>
            </select>
            <input type="text" class="search-input" id="searchInput" placeholder="搜索书名...">
            <button onclick="openAskModal()" style="padding:8px 14px; background:#3d3d3d; border:1px solid #555; border-radius:8px; color:#fff; cursor:pointer; font-size:13px;">💬 知识问答</button>
            <a href="/library/network" style="padding:8px 14px; background:#3d3d3d; border:1px solid #555; border-radius:8px; color:#fff; text-decoration:none; font-size:13px;">🕸️ 知识网络</a>
            <a href="/library/explore" style="padding:8px 14px; background:#3d3d3d; border:1px solid #555; border-radius:8px; color:#fff; text-decoration:none; font-size:13px;">🔍 专题探究</a>
            <span class="stats" id="stats">共 0 本</span>
        </div>

        <div class="storage-bar" id="storageBar" style="display:none; margin-bottom:20px; padding:12px 16px; background:#1a1a1a; border-radius:10px; border:1px solid #2a2a2a;">
            <div style="display:flex; gap:24px; flex-wrap:wrap; font-size:13px; color:#888;">
                <span>📦 存储空间：<span id="diskUsed" style="color:#fff;">-</span> / <span id="diskTotal" style="color:#666;">-</span> GB（剩余 <span id="diskFree" style="color:#27ae60;">-</span> GB）</span>
                <span>📷 相册：<span id="sizePhotos" style="color:#fff;">-</span> GB</span>
                <span>📹 视频：<span id="sizeVideos" style="color:#fff;">-</span> GB</span>
                <span>📥 待处理：<span id="sizeInbound" style="color:#fff;">-</span> GB</span>
                <span>📚 资料库：<span id="sizeLibrary" style="color:#fff;">-</span> GB</span>
            </div>
            <div style="margin-top:8px; height:4px; background:#333; border-radius:2px; overflow:hidden; max-width:600px;">
                <div id="diskProgress" style="height:100%; background:#07c160; border-radius:2px; transition:width 0.3s; width:0%;"></div>
            </div>
        </div>

        <div class="grid" id="bookGrid">
            <div class="loading">加载中...</div>
        </div>
    </div>

    <script>
        let allBooks = [];

        async function loadBooks() {
            const params = new URLSearchParams();
            const cat = document.getElementById('categoryFilter').value;
            const tag = document.getElementById('tagFilter').value;
            const search = document.getElementById('searchInput').value;
            if (cat) params.set('category', cat);
            if (tag) params.set('tag', tag);
            if (search) params.set('search', search);

            const res = await fetch('/library/api/books?' + params.toString());
            const data = await res.json();
            allBooks = data.documents || [];
            renderBooks();
            renderStats();
        }

        function renderBooks() {
            const grid = document.getElementById('bookGrid');
            if (allBooks.length === 0) {
                grid.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">📚</div>
                        <div class="empty-text">资料库为空</div>
                        <div class="empty-hint">点击右上角「上传文档」开始</div>
                    </div>`;
                return;
            }
            grid.innerHTML = allBooks.map(book => `
                <div class="book-card" onclick="location.href='/library/book/${book.id}'">
                    <div class="book-icon">${book.format_icon}</div>
                    <div class="book-name" title="${book.original_name}">${book.original_name}</div>
                    <div class="book-meta">
                        <span>${book.size_mb} MB · ${book.format.toUpperCase()}</span>
                        <span>📅 ${book.uploaded_at}</span>
                        <span class="book-category ${book.status === 'indexed' ? 'indexed' : 'pending'}">${book.category}</span>
                        <span class="chunk-badge ${book.chunk_status}">${getChunkLabel(book.chunk_status)}</span>
                    </div>
                    ${book.tags && book.tags.length ? `<div class="book-tags">${book.tags.slice(0,3).map(t => `<span class="tag">🏷️ ${t}</span>`).join('')}${book.tags.length > 3 ? `<span class="tag">+${book.tags.length-3}</span>` : ''}</div>` : ''}
                    ${renderChunkBtn(book)}
                </div>
            `).join('');
        }

        function getChunkLabel(status) {
            if (status === 'ready') return '✓ 知识库就绪';
            if (status === 'processing') return '⏳ 处理中...';
            if (status === 'error') return '✗ 处理失败';
            return '○ 待深度检索';
        }

        function renderChunkBtn(book) {
            if (book.chunk_status === 'ready') return '';
            if (book.chunk_status === 'processing') {
                return `<button class="chunk-btn" disabled>处理中...</button>`;
            }
            return `<button class="chunk-btn" onclick="event.stopPropagation(); triggerChunk('${book.id}', this)">深度检索</button>`;
        }

        function triggerChunk(docId, btn) {
            btn.disabled = true;
            btn.textContent = '处理中...';
            fetch(`/library/api/book/${docId}/chunk`, { method: 'POST' })
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        // 轮询状态
                        pollChunkStatus(docId);
                    } else {
                        btn.disabled = false;
                        btn.textContent = '处理失败，重试';
                    }
                })
                .catch(() => {
                    btn.disabled = false;
                    btn.textContent = '处理失败，重试';
                });
        }

        function pollChunkStatus(docId) {
            fetch(`/library/api/book/${docId}`)
                .then(r => r.json())
                .then(data => {
                    if (data.chunk_status === 'ready' || data.chunk_status === 'pending') {
                        loadBooks(); // 刷新
                    } else {
                        setTimeout(() => pollChunkStatus(docId), 3000);
                    }
                })
                .catch(() => setTimeout(() => pollChunkStatus(docId), 5000));
        }

        function renderStats() {
            document.getElementById('stats').textContent = `共 ${allBooks.length} 本`;
        }

        // 加载分类
        async function loadCategories() {
            const res = await fetch('/library/api/categories');
            const data = await res.json();
            const sel = document.getElementById('categoryFilter');
            data.categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                sel.appendChild(opt);
            });
        }

        async function loadTags() {
            const res = await fetch('/library/api/tags');
            const data = await res.json();
            const sel = document.getElementById('tagFilter');
            data.tags.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t;
                opt.textContent = '🏷️ ' + t;
                sel.appendChild(opt);
            });
        }

        // 筛选事件
        document.getElementById('categoryFilter').addEventListener('change', loadBooks);
        document.getElementById('tagFilter').addEventListener('change', loadBooks);
        document.getElementById('searchInput').addEventListener('input', () => {
            clearTimeout(window.searchTimer);
            window.searchTimer = setTimeout(loadBooks, 300);
        });

        async function loadStorageStats() {
            try {
                const res = await fetch('/library/api/stats');
                const data = await res.json();
                if (data.error) return;
                document.getElementById('storageBar').style.display = 'block';
                document.getElementById('diskUsed').textContent = data.used_gb;
                document.getElementById('diskTotal').textContent = data.total_gb;
                document.getElementById('diskFree').textContent = data.free_gb;
                document.getElementById('sizePhotos').textContent = data.photos_gb;
                document.getElementById('sizeVideos').textContent = data.videos_gb;
                document.getElementById('sizeInbound').textContent = data.inbound_gb;
                document.getElementById('sizeLibrary').textContent = data.library_gb;
                document.getElementById('diskProgress').style.width = data.percent + '%';
            } catch(e) {}
        }

        loadBooks();
        loadStorageStats();
        loadCategories();
        loadTags();
    </script>

    <div id="askModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:500; align-items:center; justify-content:center;">
        <div style="background:#2d2d2d; border-radius:16px; padding:28px; max-width:640px; width:90%; max-height:80vh; overflow-y:auto;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h2 style="margin:0; font-size:18px;">💬 知识问答</h2>
                <button onclick="closeAskModal()" style="background:none; border:none; color:#888; font-size:20px; cursor:pointer;">×</button>
            </div>
            <div style="margin-bottom:16px;">
                <input type="text" id="askInput" placeholder="输入问题，例如：丰子恺对人生有什么看法？" style="width:100%; padding:12px 14px; background:#1a1a1a; border:1px solid #444; border-radius:8px; color:#fff; font-size:14px; box-sizing:border-box;" onkeydown="if(event.key==='Enter')doAsk()">
            </div>
            <button onclick="doAsk()" style="width:100%; padding:12px; background:#07c160; border:none; border-radius:8px; color:#fff; font-size:14px; cursor:pointer;">提问</button>
            <div id="askAnswer" style="margin-top:16px; display:none;">
                <div id="askSources" style="font-size:12px; color:#666; margin-bottom:10px;"></div>
                <div id="askText" style="background:#1a1a1a; padding:14px; border-radius:8px; font-size:14px; line-height:1.6; white-space:pre-wrap;"></div>
            </div>
            <div id="askError" style="margin-top:12px; color:#e74c3c; font-size:13px; display:none;"></div>
        </div>
    </div>

    <script>
        function openAskModal() {
            document.getElementById('askModal').style.display = 'flex';
            document.getElementById('askInput').focus();
        }
        function closeAskModal() {
            document.getElementById('askModal').style.display = 'none';
            document.getElementById('askAnswer').style.display = 'none';
            document.getElementById('askError').style.display = 'none';
            document.getElementById('askInput').value = '';
        }

        async function doAsk() {
            const q = document.getElementById('askInput').value.trim();
            if (!q) return;
            document.getElementById('askAnswer').style.display = 'none';
            document.getElementById('askError').style.display = 'none';
            document.getElementById('askText').textContent = '思考中...';
            document.getElementById('askAnswer').style.display = 'block';

            try {
                const res = await fetch('/library/api/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: q })
                });
                const data = await res.json();
                if (data.error) {
                    document.getElementById('askError').textContent = data.error;
                    document.getElementById('askError').style.display = 'block';
                    document.getElementById('askAnswer').style.display = 'none';
                    return;
                }
                document.getElementById('askText').textContent = data.answer;
                const sources = data.sources || [];
                document.getElementById('askSources').innerHTML = sources.map(s =>
                    `📖 ${s.book} 第${s.chunk}节: ${(s.concept||[]).slice(0,2).join(', ')}`
                ).join(' | ');
                document.getElementById('askAnswer').style.display = 'block';
            } catch(e) {
                document.getElementById('askError').textContent = '请求失败：' + e.message;
                document.getElementById('askError').style.display = 'block';
            }
        }
    </script>
</body>
</html>
