<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭数据中心 - Manage</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f1117;
    color: #e0e3e8;
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    min-height: 100vh;
  }
  .header {
    background: linear-gradient(135deg, #1a1d27 0%, #141720 100%);
    border-bottom: 1px solid #2a2d3a;
    padding: 20px 32px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header-icon { font-size: 24px; }
  .header h1 { font-size: 18px; font-weight: 600; flex: 1; }
  .header-badge {
    background: #1a2332;
    border: 1px solid #2a3a5c;
    color: #5b8def;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 28px 24px;
  }

  .section-title {
    font-size: 13px;
    color: #6b7280;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 16px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }

  .card {
    background: #1a1d27;
    border: 1px solid #2a2d3a;
    border-radius: 12px;
    padding: 20px;
    transition: border-color 0.2s, transform 0.15s;
    cursor: default;
  }
  .card:hover {
    border-color: #3d4260;
    transform: translateY(-2px);
  }
  .card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .card-icon { font-size: 22px; }
  .card-name { font-size: 15px; font-weight: 600; }
  .card-desc {
    font-size: 13px;
    color: #8b919e;
    margin-bottom: 14px;
    line-height: 1.5;
  }
  .card-btns { display: flex; gap: 8px; margin-bottom: 12px; }
  .btn {
    padding: 5px 14px;
    border-radius: 6px;
    font-size: 12px;
    text-decoration: none;
    cursor: pointer;
    border: none;
    transition: background 0.15s;
  }
  .btn-primary {
    background: #2563eb;
    color: #fff;
  }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-secondary {
    background: #1e2230;
    color: #9ca3af;
    border: 1px solid #2a2d3a;
  }
  .btn-secondary:hover { background: #252836; color: #e0e3e8; }
  .card-status {
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    display: inline-block;
  }
  .status-online .status-dot { background: #22c55e; box-shadow: 0 0 4px #22c55e88; }
  .status-planning .status-dot { background: #f59e0b; }
  .status-err .status-dot { background: #ef4444; }
  .status-online { color: #22c55e; }
  .status-planning { color: #f59e0b; }
  .status-err { color: #ef4444; }

  /* 文档查看区 */
  .doc-panel {
    background: #1a1d27;
    border: 1px solid #2a2d3a;
    border-radius: 12px;
    overflow: hidden;
    display: none;
  }
  .doc-panel.active { display: block; }
  .doc-toolbar {
    background: #141720;
    border-bottom: 1px solid #2a2d3a;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .doc-title {
    flex: 1;
    font-size: 13px;
    font-weight: 600;
    color: #9ca3af;
  }
  .doc-close {
    background: none;
    border: none;
    color: #6b7280;
    cursor: pointer;
    font-size: 18px;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .doc-close:hover { background: #2a2d3a; color: #e0e3e8; }
  .doc-content {
    height: 500px;
    overflow-y: auto;
    padding: 20px 24px;
    font-size: 13px;
    line-height: 1.7;
    color: #c9cdd4;
  }
  .doc-content h1 { font-size: 18px; color: #e0e3e8; margin-bottom: 12px; border-bottom: 1px solid #2a2d3a; padding-bottom: 8px; }
  .doc-content h2 { font-size: 15px; color: #d1d5db; margin: 14px 0 8px; }
  .doc-content h3 { font-size: 13px; color: #b0b6c0; margin: 10px 0 6px; }
  .doc-content table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 12px; }
  .doc-content th, .doc-content td { border: 1px solid #2a2d3a; padding: 6px 10px; text-align: left; }
  .doc-content th { background: #141720; color: #9ca3af; }
  .doc-content code { background: #141720; padding: 1px 5px; border-radius: 3px; font-size: 12px; color: #93c5fd; }
  .doc-content pre { background: #141720; padding: 12px; border-radius: 6px; overflow-x: auto; margin: 8px 0; }
  .doc-content pre code { background: none; padding: 0; }
  .doc-content ul, .doc-content ol { padding-left: 20px; margin: 6px 0; }
  .doc-content li { margin: 3px 0; }
  .doc-content blockquote {
    border-left: 3px solid #2563eb;
    padding: 4px 12px;
    color: #8b919e;
    background: #141720;
    margin: 8px 0;
  }
  .doc-content a { color: #5b8def; text-decoration: none; }
  .doc-content a:hover { text-decoration: underline; }
  .doc-content p { margin: 6px 0; }
  .doc-content .todo-pending { color: #f59e0b; }
  .doc-content .todo-done { color: #22c55e; }

  /* 底部 */
  .footer {
    text-align: center;
    padding: 20px;
    font-size: 12px;
    color: #4b5563;
    border-top: 1px solid #1a1d27;
  }
  .footer a { color: #4b5563; text-decoration: none; }
  .footer a:hover { color: #6b7280; }
</style>
</head>
<body>

<div class="header">
  <span class="header-icon">🏠</span>
  <h1>家庭数据中心</h1>
  <span class="header-badge">manage</span>
</div>

<div class="container">

<p class="section-title">● 项目列表</p>

<div class="grid" id="projectGrid">
</div>

<p class="section-title">● 项目文档</p>
<div class="doc-panel" id="docPanel">
  <div class="doc-toolbar">
    <span class="doc-title" id="docTitle">文档</span>
    <button class="doc-close" onclick="closeDoc()">✕</button>
  </div>
  <div class="doc-content" id="docContent">加载中...</div>
</div>

</div>

<div class="footer">
  <a href="/openclaw/">← OpenClaw 控制面板</a>
  &nbsp;|&nbsp;
  <span id="now"></span>
</div>

<script>
const PROJECTS = [
  {
    id: "gallery",
    name: "📷 相册",
    desc: "照片管理，支持时间线、标签筛选、缩略图预览。已接入 nginx 缓存加速。",
    status: "online",
    url: "/gallery/",
    doc: "memory/projects/相册.md"
  },
  {
    id: "library",
    name: "📚 电子书库",
    desc: "文档上传 → AI 分析 → 知识库 → RAG 问答。支持 PDF/TXT/EPUB，含知识网络图谱。",
    status: "online",
    url: "/library/",
    doc: "memory/projects/电子书库.md"
  },
  {
    id: "knowledge",
    name: "🧠 个人知识管理",
    desc: "收集素材 → 整理归纳 → 创作输出。持续建设中。",
    status: "planning",
    url: null,
    doc: "memory/projects/个人知识管理.md"
  },
  {
    id: "media",
    name: "📝 自媒体工具",
    desc: "内容采集、编辑、发布辅助工具。规划中。",
    status: "planning",
    url: null,
    doc: "memory/projects/自媒体工具.md"
  }
];

const STATUS_LABEL = {
  online: "● 运行中",
  planning: "○ 规划中",
  err: "● 异常"
};

function render() {
  const grid = document.getElementById("projectGrid");
  grid.innerHTML = PROJECTS.map(p => `
    <div class="card">
      <div class="card-header">
        <span class="card-icon">${p.name.split(" ")[0]}</span>
        <span class="card-name">${p.name.split(" ").slice(1).join(" ")}</span>
      </div>
      <p class="card-desc">${p.desc}</p>
      <div class="card-btns">
        ${p.url
          ? `<a class="btn btn-primary" href="${p.url}">访问</a>`
          : `<a class="btn btn-primary" style="opacity:0.4;cursor:not-allowed">访问</a>`}
        <button class="btn btn-secondary" onclick="openDoc('${p.id}')">📄 文档</button>
      </div>
      <div class="card-status status-${p.status}">
        <span class="status-dot"></span>
        <span>${STATUS_LABEL[p.status]}</span>
      </div>
    </div>
  `).join("");

  // 更新时间
  const now = document.getElementById("now");
  const d = new Date();
  now.textContent = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}

async function openDoc(id) {
  const p = PROJECTS.find(x => x.id === id);
  if (!p) return;

  const panel = document.getElementById("docPanel");
  const title = document.getElementById("docTitle");
  const content = document.getElementById("docContent");

  panel.classList.add("active");
  title.textContent = p.name + " - 项目文档";
  content.innerHTML = "<p style='color:#6b7280'>加载中...</p>";
  window.scrollTo(0, document.getElementById("docPanel").offsetTop - 20);

  try {
    const resp = await fetch("/" + p.doc);
    if (!resp.ok) throw new Error("文件不存在");
    let text = await resp.text();

    // 简单的 Markdown → HTML 渲染
    content.innerHTML = renderMd(text);
  } catch(e) {
    content.innerHTML = `<p style="color:#ef4444">加载失败: ${e.message}</p>`;
  }
}

function closeDoc() {
  document.getElementById("docPanel").classList.remove("active");
}

function renderMd(text) {
  // 预处理：转义 HTML 特殊字符
  text = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  const lines = text.split("\n");
  const out = [];
  let i = 0;
  let inCode = false;
  let inList = false;
  let inTable = false;

  const closeList = () => {
    if (inList) { out.push("</ul>"); inList = false; }
  };
  const closeTable = () => {
    if (inTable) { out.push("</tbody></table>"); inTable = false; }
  };

  while (i < lines.length) {
    const line = lines[i].replace(/\r$/, "");

    // 代码块
    if (line.startsWith("```")) {
      if (!inCode) {
        closeList(); closeTable();
        const lang = line.slice(3).trim();
        out.push(`<pre><code class="lang-${lang}">`);
        inCode = true;
      } else {
        out.push("</code></pre>");
        inCode = false;
      }
      i++; continue;
    }
    if (inCode) {
      out.push(line.replace(/&lt;/g, "&lt;").replace(/&gt;/g, "&gt;"));
      i++; continue;
    }

    // 标题
    if (line.startsWith("# ")) {
      closeList(); closeTable();
      out.push(`<h1>${line.slice(2)}</h1>`);
      i++; continue;
    }
    if (line.startsWith("## ")) {
      closeList(); closeTable();
      out.push(`<h2>${line.slice(3)}</h2>`);
      i++; continue;
    }
    if (line.startsWith("### ")) {
      closeList(); closeTable();
      out.push(`<h3>${line.slice(4)}</h3>`);
      i++; continue;
    }

    // 表格
    if (line.includes("|") && line.trim().startsWith("|")) {
      closeList();
      if (!inTable) {
        // 表头行
        const headers = line.split("|").slice(1, -1).map(h => h.trim());
        out.push(`<table><thead><tr>${headers.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>`);
        inTable = true;
        i++;
        // 跳过分隔行
        if (lines[i] && lines[i].match(/^[\|\-\s:]+$/)) i++;
        continue;
      } else {
        const cells = line.split("|").slice(1, -1).map(c => c.trim());
        out.push(`<tr>${cells.map(c => `<td>${c}</td>`).join("")}</tr>`);
        i++; continue;
      }
    } else {
      closeTable();
    }

    // 列表
    if (line.match(/^[\-\*] /)) {
      if (!inList) { out.push("<ul>"); inList = true; }
      let item = line.replace(/^[\-\*] /, "");
      out.push(`<li>${inlineMd(item)}</li>`);
      i++; continue;
    }

    // 空行
    if (!line.trim()) {
      closeList();
      i++; continue;
    }

    // 普通段落
    closeList();
    out.push(`<p>${inlineMd(line)}</p>`);
    i++;
  }

  closeList();
  closeTable();

  return out.join("\n");
}

function inlineMd(text) {
  return text
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
    .replace(/^\- /, "");
}

render();
</script>

</body>
</html>
