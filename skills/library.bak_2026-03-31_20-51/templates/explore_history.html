<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>专题探究历史 - 电子书库</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0f1117;
            color: #e0e3e8;
            font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            background: linear-gradient(135deg, #1a1d27 0%, #141720 100%);
            border-bottom: 1px solid #2a2d3a;
            padding: 20px 32px;
            margin: -20px -20px 30px -20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-icon { font-size: 24px; }
        .header h1 { font-size: 18px; font-weight: 600; flex: 1; }
        .back-link {
            color: #5b8def;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover { text-decoration: underline; }
        .container { max-width: 900px; margin: 0 auto; }
        .section-title {
            font-size: 13px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 16px;
        }
        .record-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .record-card {
            background: #1a1d27;
            border: 1px solid #2a2d3a;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .record-card:hover {
            border-color: #5b8def;
            transform: translateY(-2px);
        }
        .record-title {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 8px;
        }
        .record-meta {
            font-size: 12px;
            color: #6b7280;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .record-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .record-preview {
            font-size: 14px;
            color: #9ca3af;
            margin-top: 12px;
            line-height: 1.5;
        }
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }
        .empty-icon { font-size: 48px; margin-bottom: 16px; }
        .tag {
            background: #1a2332;
            border: 1px solid #2a3a5c;
            color: #5b8def;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
        }
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            overflow-y: auto;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #1a1d27;
            max-width: 900px;
            width: 95%;
            margin: 40px auto;
            border-radius: 12px;
            padding: 24px;
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            color: #6b7280;
            font-size: 28px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #2a2d3a;
        }
        .modal-close:hover { background: #3a3d4a; color: #fff; }
        .modal-header {
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #2a2d3a;
        }
        .modal-title { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
        .modal-meta { font-size: 12px; color: #6b7280; }
        .md-content {
            background: #141720;
            border-radius: 8px;
            padding: 20px;
            font-size: 14px;
            line-height: 1.8;
            max-height: 60vh;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .md-content h1 { font-size: 20px; margin: 16px 0 8px; color: #fff; }
        .md-content h2 { font-size: 16px; margin: 14px 0 6px; color: #5b8def; }
        .md-content p { margin: 8px 0; }
        .md-content strong { color: #fff; }
        .md-content ul, .md-content ol { margin: 8px 0; padding-left: 24px; }
        .md-content li { margin: 4px 0; }
        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="header">
        <span class="header-icon">📚</span>
        <h1>专题探究历史</h1>
        <a href="/library/explore" class="back-link">← 返回专题探究</a>
    </div>
    
    <div class="container">
        <div class="section-title">历史记录</div>
        <div id="recordList" class="record-list">
            <div class="loading">加载中...</div>
        </div>
    </div>
    
    <!-- 详情弹窗 -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-close" onclick="closeModal()">&times;</div>
            <div class="modal-header">
                <div class="modal-title" id="modalTitle"></div>
                <div class="modal-meta" id="modalMeta"></div>
            </div>
            <div class="md-content" id="modalContent"></div>
        </div>
    </div>
    
    <script>
        // 加载历史记录
        async function loadRecords() {
            try {
                const resp = await fetch('/library/api/explore/history');
                const data = await resp.json();
                const list = document.getElementById('recordList');
                
                if (!data.records || data.records.length === 0) {
                    list.innerHTML = `
                        <div class="empty">
                            <div class="empty-icon">📭</div>
                            <div>暂无历史记录</div>
                            <div style="font-size:12px;margin-top:8px">进行专题探究后会保存在这里</div>
                        </div>
                    `;
                    return;
                }
                
                list.innerHTML = data.records.map(r => `
                    <div class="record-card" onclick="viewRecord('${r.id}')">
                        <div class="record-title">📖 ${escapeHtml(r.query)}</div>
                        <div class="record-meta">
                            <span>📅 ${formatTime(r.created_at)}</span>
                            <span>📚 ${r.books ? r.books.length : 0} 本书</span>
                        </div>
                        <div class="record-preview">${escapeHtml(r.preview || '')}</div>
                    </div>
                `).join('');
            } catch (e) {
                document.getElementById('recordList').innerHTML = '<div class="empty">加载失败</div>';
            }
        }
        
        async function viewRecord(id) {
            const modal = document.getElementById('modal');
            const title = document.getElementById('modalTitle');
            const meta = document.getElementById('modalMeta');
            const content = document.getElementById('modalContent');
            
            modal.classList.add('active');
            content.textContent = '加载中...';
            
            try {
                const resp = await fetch(`/library/api/explore/record/${id}`);
                const data = await resp.json();
                
                if (data.error) {
                    content.textContent = data.error;
                    return;
                }
                
                // 解析 MD 内容显示
                content.textContent = data.content;
                
                // 提取标题
                const lines = data.content.split('\n');
                title.textContent = lines[0].replace(/^#+\s*/, '') || '专题探究';
                
                // 提取元信息
                const metaLines = lines.filter(l => l.startsWith('**')).slice(0, 3);
                meta.innerHTML = metaLines.map(l => `<span>${l.replace(/\*\*/g, '')}</span>`).join('');
                
            } catch (e) {
                content.textContent = '加载失败: ' + e.message;
            }
        }
        
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function formatTime(isoString) {
            if (!isoString) return '';
            const d = new Date(isoString);
            return d.toLocaleString('zh-CN', { hour12: false });
        }
        
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeModal();
        });
        
        loadRecords();
    </script>
</body>
</html>
