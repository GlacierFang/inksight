<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF 阅读器</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  .toolbar {
    height: 50px; background: #1a1a1a; border-bottom: 1px solid #333;
    display: flex; align-items: center; gap: 12px; padding: 0 16px;
  }
  .back-btn { background: #2d2d2d; border: none; color: #fff; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .back-btn:hover { background: #3d3d3d; }
  .book-title { flex: 1; font-size: 14px; color: #888; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #pdf-canvas { width: 100%; height: calc(100vh - 50px); display: block; }
  .loading {
    display: flex; align-items: center; justify-content: center;
    height: calc(100vh - 50px); color: #666; flex-direction: column; gap: 12px;
  }
  .loading-spinner {
    width: 40px; height: 40px; border: 3px solid #333;
    border-top-color: #07c160; border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error {
    display: flex; align-items: center; justify-content: center;
    height: calc(100vh - 50px); color: #e74c3c;
    flex-direction: column; gap: 12px;
  }
  #page-input {
    background: #2d2d2d; border: 1px solid #444; color: #fff;
    width: 60px; text-align: center; border-radius: 4px; padding: 4px 8px;
  }
  #total-pages { color: #888; font-size: 13px; }
  button.nav-btn {
    background: #2d2d2d; border: none; color: #fff;
    padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  button.nav-btn:hover { background: #3d3d3d; }
  button.nav-btn:disabled { background: #222; color: #555; cursor: not-allowed; }
</style>
</head>
<body>

<div class="toolbar">
  <button class="back-btn" onclick="history.back()">← 返回</button>
  <span class="book-title" id="bookTitle">PDF 阅读器</span>
  <button class="nav-btn" id="prevBtn" onclick="prevPage()" disabled>◀</button>
  <input type="number" id="page-input" value="1" min="1" onchange="goToPage(this.value)">
  <span id="total-pages">/ 1</span>
  <button class="nav-btn" id="nextBtn" onclick="nextPage()" disabled>▶</button>
</div>

<div id="pdf-viewer">
  <div class="loading" id="loading">
    <div class="loading-spinner"></div>
    <span>正在加载 PDF...</span>
  </div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const docId = window.location.pathname.split('/').pop();
let pdfDoc = null;
let currentPage = 1;
let totalPages = 0;

const loadingTask = pdfjsLib.getDocument(`/library/file/${docId}`);
loadingTask.promise.then((pdf) => {
  pdfDoc = pdf;
  totalPages = pdf.numPages;
  document.getElementById('total-pages').textContent = `/ ${totalPages}`;
  document.getElementById('page-input').max = totalPages;
  document.getElementById('loading').style.display = 'none';
  renderPage(currentPage);
}).catch((err) => {
  document.getElementById('loading').innerHTML = `<div class="error">加载失败: ${err.message}</div>`;
});

function renderPage(num) {
  pdfDoc.getPage(num).then((page) => {
    const scale = window.innerWidth / page.getViewport({scale: 1.0}).width;
    const viewport = page.getViewport({scale});
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    canvas.id = 'pdf-canvas';
    const viewer = document.getElementById('pdf-viewer');
    viewer.innerHTML = '';
    viewer.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    page.render({canvasContext: ctx, viewport}).promise;
    updateControls();
  });
}

function prevPage() { if (currentPage > 1) { currentPage--; renderPage(currentPage); } }
function nextPage() { if (currentPage < totalPages) { currentPage++; renderPage(currentPage); } }
function goToPage(n) { const p = parseInt(n); if (p >= 1 && p <= totalPages) { currentPage = p; renderPage(currentPage); } }
function updateControls() {
  document.getElementById('prevBtn').disabled = currentPage <= 1;
  document.getElementById('nextBtn').disabled = currentPage >= totalPages;
  document.getElementById('page-input').value = currentPage;
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') prevPage();
  if (e.key === 'ArrowRight') nextPage();
});
</script>
</body>
</html>
