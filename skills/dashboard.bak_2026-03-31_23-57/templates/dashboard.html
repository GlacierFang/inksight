<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人工作台</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #f0f2f5; color: #1f2329; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; min-height: 100vh; }

        /* Header */
        header {
            background: #fff; border-bottom: 1px solid #e5e7eb;
            padding: 16px 32px; display: flex; align-items: center; gap: 12px;
            position: sticky; top: 0; z-index: 100;
        }
        header h1 { font-size: 18px; font-weight: 600; flex: 1; }
        .header-badge { background: #e8f5e9; color: #07c160; padding: 3px 10px; border-radius: 20px; font-size: 12px; }

        /* Container */
        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

        /* Page tabs */
        .page-tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 2px solid #e5e7eb; padding-bottom: 0; }
        .page-tab {
            padding: 10px 20px; font-size: 14px; cursor: pointer; border: none;
            background: none; color: #646a73; border-bottom: 2px solid transparent;
            margin-bottom: -2px; transition: all 0.15s;
        }
        .page-tab.active { color: #07c160; border-bottom-color: #07c160; font-weight: 600; }

        /* Period tabs */
        .period-tabs { display: flex; gap: 4px; margin-bottom: 20px; }
        .period-tab {
            padding: 6px 16px; border-radius: 6px; font-size: 13px; cursor: pointer;
            border: 1px solid #e5e7eb; background: #fff; color: #646a73;
        }
        .period-tab.active { background: #07c160; color: #fff; border-color: #07c160; }

        /* Top stats grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 14px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #fff; border-radius: 12px; padding: 18px 20px;
            border: 1px solid #e5e7eb;
        }
        .stat-label { font-size: 12px; color: #8f959e; margin-bottom: 6px; }
        .stat-value { font-size: 26px; font-weight: 700; line-height: 1.1; }
        .stat-value.green { color: #07c160; }
        .stat-value.amber { color: #f59e0b; }
        .stat-value.red { color: #ef4444; }
        .stat-sub { font-size: 11px; color: #8f959e; margin-top: 3px; }

        /* Main grid */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }
        .panel {
            background: #fff; border-radius: 12px; padding: 20px 24px;
            border: 1px solid #e5e7eb;
        }
        .panel-title {
            font-size: 14px; font-weight: 600; color: #1f2329; margin-bottom: 16px;
            display: flex; align-items: center; gap: 8px;
        }
        .panel-title .badge {
            font-size: 11px; font-weight: 400; background: #f0f1f3; color: #646a73;
            padding: 2px 8px; border-radius: 10px;
        }
        .panel-title .badge.warn { background: #fff7e6; color: #f59e0b; }
        .panel-title .badge.ok { background: #e8f5e9; color: #07c160; }
        .panel-title .badge.error { background: #fef2f2; color: #ef4444; }

        /* Charts row */
        .charts-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        /* Calendar row */
        .calendar-row {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 16px;
            margin-bottom: 20px;
        }

        /* Bottom row */
        .bottom-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
        }

        /* Chart containers */
        .chart-box { width: 100%; }

        /* Calendar */
        .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .cal-nav { display: flex; gap: 6px; }
        .cal-nav button {
            background: #f7f8fa; border: 1px solid #e5e7eb; color: #1f2329;
            padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 13px;
        }
        .cal-nav button:hover { background: #f0f1f3; }
        .cal-month { font-size: 14px; font-weight: 600; }
        .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 3px; }
        .cal-weekday { text-align: center; font-size: 11px; color: #8f959e; padding: 4px 0; font-weight: 500; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
        .cal-day {
            aspect-ratio: 1; display: flex; flex-direction: column; align-items: center;
            justify-content: center; border-radius: 8px; font-size: 13px;
            cursor: pointer; transition: all 0.15s; gap: 2px;
        }
        .cal-day:hover { background: #f7f8fa; }
        .cal-day.other-month { color: #d1d5db; }
        .cal-day.today { background: #e8f5e9; font-weight: 600; }
        .cal-day.selected { background: #07c160; color: #fff; }
        .cal-day .dots { display: flex; gap: 2px; justify-content: center; }
        .cal-day .dot { width: 5px; height: 5px; border-radius: 50%; }
        .dot-success { background: #07c160; }
        .dot-pending { background: #f59e0b; }
        .dot-missed { background: #ef4444; }

        /* Day detail */
        .day-detail { background: #fff; border-radius: 12px; border: 1px solid #e5e7eb; overflow: hidden; }
        .day-detail-header {
            padding: 14px 18px; border-bottom: 1px solid #f1f2f5;
            font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; align-items: center;
        }
        .day-detail-header .close-btn { background: none; border: none; font-size: 18px; cursor: pointer; color: #8f959e; padding: 0; }
        .day-detail-body { padding: 12px 18px; }
        .day-task { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid #f8f9fa; }
        .day-task:last-child { border-bottom: none; }
        .day-task-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .day-task-name { font-size: 13px; color: #1f2329; flex: 1; }
        .day-task-meta { font-size: 12px; color: #8f959e; }
        .mark-btn {
            margin-left: auto; padding: 4px 10px; background: #07c160; color: #fff;
            border: none; border-radius: 5px; font-size: 12px; cursor: pointer; flex-shrink: 0;
        }
        .mark-btn:hover { background: #06a555; }
        .day-empty { text-align: center; padding: 20px; color: #8f959e; font-size: 13px; line-height: 1.6; }

        /* Books */
        .book-list { display: flex; flex-direction: column; gap: 12px; }
        .book-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .book-name { font-size: 13px; color: #1f2329; font-weight: 500; }
        .book-pct { font-size: 13px; color: #07c160; font-weight: 600; }
        .book-bar { height: 5px; background: #f1f3f5; border-radius: 3px; overflow: hidden; }
        .book-fill { height: 100%; background: #07c160; border-radius: 3px; }
        .book-meta { font-size: 11px; color: #8f959e; margin-top: 3px; }

        /* Memory */
        .memory-list { display: flex; flex-direction: column; }
        .memory-item { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid #f5f6f8; }
        .memory-item:last-child { border-bottom: none; }
        .memory-name { font-size: 13px; color: #1f2329; }
        .memory-name .sub { font-size: 11px; color: #8f959e; }
        .memory-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; }
        .badge-ok { background: #e8f5e9; color: #07c160; }
        .badge-warn { background: #fff7e6; color: #f59e0b; }

        /* Quick links */
        .quick-links { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .quick-link {
            display: flex; align-items: center; gap: 8px;
            padding: 9px 12px; background: #f7f8fa; border: 1px solid #e5e7eb;
            border-radius: 8px; color: #1f2329; text-decoration: none; font-size: 13px;
            transition: all 0.15s;
        }
        .quick-link:hover { background: #f0f1f3; border-color: #07c160; color: #07c160; }

        /* Sessions / Staff */
        .session-list { display: flex; flex-direction: column; gap: 8px; }
        .session-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; background: #f7f8fa; border-radius: 8px;
        }
        .session-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .dot-active { background: #07c160; }
        .dot-idle { background: #f59e0b; }
        .dot-running { background: #5bc0de; }
        .session-name { font-size: 13px; color: #1f2329; flex: 1; }
        .session-meta { font-size: 11px; color: #8f959e; }

        /* Activity */
        .activity-list { display: flex; flex-direction: column; gap: 6px; }
        .activity-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #f7f8fa; border-radius: 8px; }
        .activity-hour { font-size: 12px; color: #8f959e; min-width: 36px; }
        .activity-bar-wrap { flex: 1; height: 6px; background: #e5e7eb; border-radius: 3px; overflow: hidden; }
        .activity-bar { height: 100%; background: #07c160; border-radius: 3px; }
        .activity-count { font-size: 12px; color: #8f959e; min-width: 40px; text-align: right; }

        /* Source legend */
        .source-legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .source-item { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #646a73; }
        .source-dot { width: 8px; height: 8px; border-radius: 50%; }

        /* System status */
        .sys-status { display: flex; flex-direction: column; gap: 8px; }
        .sys-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f5f6f8; }
        .sys-item:last-child { border-bottom: none; }
        .sys-name { font-size: 13px; color: #1f2329; }
        .sys-value { font-size: 12px; font-weight: 600; }
        .sys-value.ok { color: #07c160; }
        .sys-value.warn { color: #f59e0b; }
        .sys-value.error { color: #ef4444; }

        /* No data / loading */
        .no-data { text-align: center; padding: 24px; color: #bfc3c9; font-size: 13px; }
        .loading { text-align: center; padding: 20px; color: #8f959e; font-size: 13px; }
        .loading::after { content: '...'; animation: dots 1s infinite; }
        @keyframes dots { 0%,20%{content:'.'} 40%{content:'..'} 60%,100%{content:'...'} }

        /* Footer */
        footer { text-align: center; padding: 20px; font-size: 12px; color: #bfc3c9; margin-top: 8px; }

        /* Responsive */
        @media (max-width: 900px) {
            .stats-grid { grid-template-columns: repeat(3, 1fr); }
            .main-grid, .charts-row, .calendar-row, .bottom-row { grid-template-columns: 1fr; }
        }
        @media (max-width: 600px) {
            .container { padding: 16px; }
            header { padding: 14px 16px; }
            .stats-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
        }
    </style>
</head>
<body>

<header>
    <span style="font-size:22px">📊</span>
    <h1>个人工作台</h1>
    <span class="header-badge">Dashboard</span>
</header>

<div class="container">

    <!-- Page tabs -->
    <div class="page-tabs">
        <button class="page-tab active" onclick="setPage('overview')">📋 总览</button>
        <button class="page-tab" onclick="setPage('usage')">📈 用量</button>
        <button class="page-tab" onclick="setPage('sessions')">👥 员工</button>
    </div>

    <!-- Period tabs -->
    <div class="period-tabs" id="periodTabs">
        <button class="period-tab active" data-period="day" onclick="setPeriod('day')">今日</button>
        <button class="period-tab" data-period="week" onclick="setPeriod('week')">本周</button>
        <button class="period-tab" data-period="month" onclick="setPeriod('month')">本月</button>
    </div>

    <!-- ======================== 总览页 ======================== -->
    <div id="page-overview">

        <!-- Top stats -->
        <div class="stats-grid" style="margin-bottom:20px">
            <div class="stat-card">
                <div class="stat-label">API 调用</div>
                <div class="stat-value" id="statTotal">-</div>
                <div class="stat-sub" id="statRange">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">窗口配额</div>
                <div class="stat-value green" id="statWindow">-</div>
                <div class="stat-sub">5小时窗口</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">发布次数</div>
                <div class="stat-value" id="publishTotal">-</div>
                <div class="stat-sub" id="publishRate">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">深入分析</div>
                <div class="stat-value" id="analysisBooks">-</div>
                <div class="stat-sub" id="analysisToday">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">系统状态</div>
                <div class="stat-value green" id="sysOverall">-</div>
                <div class="stat-sub" id="sysStatus">-</div>
            </div>
        </div>

        <!-- Main panels -->
        <div class="main-grid">
            <div class="panel">
                <div class="panel-title">
                    🧠 记忆状态
                    <span class="badge" id="memoryBadge">-</span>
                </div>
                <div id="memoryList"><div class="loading">加载中</div></div>
            </div>

            <div class="panel">
                <div class="panel-title">
                    📚 深入分析
                    <span class="badge" id="analysisBadge">-</span>
                </div>
                <div class="book-list" id="analysisList"><div class="loading">加载中</div></div>
            </div>
        </div>

        <!-- Quick links + Sessions + Publish -->
        <div class="bottom-row" style="margin-top:0">
            <div class="panel">
                <div class="panel-title">⚡ 快速入口</div>
                <div class="quick-links" id="quickLinks"><div class="loading">加载中</div></div>
            </div>

            <div class="panel">
                <div class="panel-title">👥 活跃会话</div>
                <div id="sessionsList"><div class="loading">加载中</div></div>
            </div>

            <div class="panel">
                <div class="panel-title">📅 发布日历 <span class="badge" id="pubOverviewRate">-</span></div>
                <div class="cal-header">
                    <div class="cal-nav">
                        <button onclick="changeMonthOverview(-1)">◀</button>
                        <button onclick="changeMonthOverview(1)">▶</button>
                    </div>
                    <span class="cal-month" id="calendarMonthOverview">-</span>
                </div>
                <div class="cal-weekdays">
                    <div class="cal-weekday">周一</div>
                    <div class="cal-weekday">周二</div>
                    <div class="cal-weekday">周三</div>
                    <div class="cal-weekday">周四</div>
                    <div class="cal-weekday">周五</div>
                    <div class="cal-weekday">周六</div>
                    <div class="cal-weekday">周日</div>
                </div>
                <div class="cal-grid" id="calendarGridOverview"></div>
            </div>
        </div>

    </div>

    <!-- ======================== 用量页 ======================== -->
    <div id="page-usage" style="display:none">

        <div class="charts-row">
            <div class="panel">
                <div class="panel-title">📊 来源分布（饼图）</div>
                <div class="chart-box" id="chartPie"></div>
                <div class="source-legend" id="sourceLegend"></div>
            </div>
            <div class="panel">
                <div class="panel-title">📈 每日调用趋势（近30天柱状图）</div>
                <div class="chart-box" id="chartBar"></div>
            </div>
        </div>

        <div class="main-grid">
            <div class="panel">
                <div class="panel-title">🕐 今日活动</div>
                <div id="activityList"><div class="loading">加载中</div></div>
            </div>
            <div class="panel">
                <div class="panel-title">📋 系统状态</div>
                <div class="sys-status" id="sysStatusList"><div class="loading">加载中</div></div>
            </div>
        </div>

    </div>

    <!-- ======================== 发布页 ======================== -->
    <div id="page-publish" style="display:none">
        <!-- 发布日历页面（通过 Overview 底部链接访问） -->
    </div>

    <!-- ======================== Sessions 页 ======================== -->
    <div id="page-sessions" style="display:none">
        <div class="stats-grid" style="margin-bottom:20px">
            <div class="stat-card">
                <div class="stat-label">总会话数</div>
                <div class="stat-value" id="sessTotal">-</div>
                <div class="stat-sub">个</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">活跃</div>
                <div class="stat-value green" id="sessActive">-</div>
                <div class="stat-sub">个</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">执行中</div>
                <div class="stat-value amber" id="sessRunning">-</div>
                <div class="stat-sub">个</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">空闲</div>
                <div class="stat-value" id="sessIdle">-</div>
                <div class="stat-sub">个</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">订阅窗口</div>
                <div class="stat-value" id="sessWindow">-</div>
                <div class="stat-sub">5小时窗口</div>
            </div>
        </div>

        <div class="main-grid">
            <div class="panel">
                <div class="panel-title">👥 会话详情</div>
                <div id="sessionsDetail"><div class="loading">加载中</div></div>
            </div>
            <div class="panel">
                <div class="panel-title">📅 发布日历</div>
                <div class="cal-header">
                    <div class="cal-nav">
                        <button onclick="changeMonth(-1)">◀</button>
                        <button onclick="changeMonth(1)">▶</button>
                    </div>
                    <span class="cal-month" id="calendarMonth2">-</span>
                </div>
                <div class="cal-weekdays">
                    <div class="cal-weekday">周一</div>
                    <div class="cal-weekday">周二</div>
                    <div class="cal-weekday">周三</div>
                    <div class="cal-weekday">周四</div>
                    <div class="cal-weekday">周五</div>
                    <div class="cal-weekday">周六</div>
                    <div class="cal-weekday">周日</div>
                </div>
                <div class="cal-grid" id="calendarGrid2"></div>
            </div>
        </div>
    </div>

</div>

<footer>个人工作台 · <span id="lastUpdate">-</span></footer>

<script>
const SOURCE_COLORS = ['#07c160','#5bc0de','#f39c12','#9b59b6','#e74c3c','#3498db'];

let currentPage = 'overview';
let currentPeriod = 'day';
let calendarYear, calendarMonth;
let calendarData = {};

async function api(url) {
    const r = await fetch(url);
    return r.json();
}

async function loadAll() {
    await Promise.all([
        loadStats(),
        loadPublish(),
        loadAnalysis(),
        loadMemory(),
        loadProjects(),
        loadSessions(),
        loadSysStatus()
    ]);
    loadCalendar(calendarYear, calendarMonth);
    document.getElementById('lastUpdate').textContent = new Date().toLocaleString('zh-CN');
}

// ===== Stats =====
async function loadStats() {
    try {
        const d = await api('/dashboard/api/stats?period=' + currentPeriod);
        document.getElementById('statTotal').textContent = d.total_calls || 0;
        document.getElementById('statRange').textContent = d.range ? d.range.start + ' 起' : '-';

        const remaining = (d.window_limit || 600) - (d.window_calls || 0);
        const pct = Math.round(remaining / (d.window_limit || 600) * 100);
        const el = document.getElementById('statWindow');
        el.textContent = remaining + '/' + (d.window_limit || 600);
        el.className = 'stat-value ' + (pct > 50 ? 'green' : pct > 20 ? 'amber' : 'red');

        // 饼图只在 usage 页渲染
        if (currentPage === 'usage') {
            const sources = Object.entries(d.by_source || {});
            renderPieChart(sources);
            document.getElementById('sourceLegend').innerHTML = sources.map(([s, c], i) =>
                `<div class="source-item"><span class="source-dot" style="background:${SOURCE_COLORS[i%SOURCE_COLORS.length]}"></span>${escHtml(s)} (${c})</div>`
            ).join('');
        }
    } catch(e) { console.error(e); }
}

// ===== Pie Chart =====
function renderPieChart(data) {
    const el = document.getElementById('chartPie');
    el.innerHTML = '';
    if (!data || data.length === 0) { el.innerHTML = '<div class="no-data">暂无数据</div>'; return; }
    const w = el.clientWidth || 280, h = 200;
    const radius = Math.min(w, h) / 2 - 20;
    const svg = d3.select(el).append('svg').attr('viewBox', `0 0 ${w} ${h}`);
    const g = svg.append('g').attr('transform', `translate(${w/2},${h/2})`);
    const pie = d3.pie().value(d => d[1]).sort(null);
    const arc = d3.arc().innerRadius(radius * 0.55).outerRadius(radius);
    const total = data.reduce((s, d) => s + d[1], 0);
    g.selectAll('path').data(pie(data)).join('path')
        .attr('d', arc).attr('fill', (d, i) => SOURCE_COLORS[i % SOURCE_COLORS.length]).attr('opacity', 0.9)
        .append('title').text(d => `${d.data[0]}: ${d.data[1]} (${(d.data[1]/total*100).toFixed(0)}%)`);
}

// ===== Bar Chart (daily) =====
async function loadBarChart() {
    try {
        const d = await api('/dashboard/api/stats-daily');
        renderBarChart(d.daily || []);
    } catch(e) { console.error(e); }
}

function renderBarChart(data) {
    const el = document.getElementById('chartBar');
    el.innerHTML = '';
    if (!data || data.length === 0) { el.innerHTML = '<div class="no-data">暂无数据</div>'; return; }

    const w = el.clientWidth || 400, h = 200;
    const margin = { top: 10, right: 10, bottom: 30, left: 35 };
    const iw = w - margin.left - margin.right, ih = h - margin.top - margin.bottom;

    const svg = d3.select(el).append('svg').attr('viewBox', `0 0 ${w} ${h}`);
    const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

    const x = d3.scaleBand().domain(data.map(d => d.date.slice(5))).range([0, iw]).padding(0.2);
    const y = d3.scaleLinear().domain([0, d3.max(data, d => d.total) || 1]).nice().range([ih, 0]);

    // Grid
    g.append('g').call(d3.axisLeft(y).tickSize(-iw).tickFormat(''))
        .selectAll('line').attr('stroke', '#f1f3f5');
    g.select('.domain').remove();

    // Bars
    g.selectAll('rect').data(data).join('rect')
        .attr('x', d => x(d.date.slice(5))).attr('y', d => y(d.total))
        .attr('width', x.bandwidth()).attr('height', d => ih - y(d.total))
        .attr('fill', '#07c160').attr('rx', 3)
        .append('title').text(d => `${d.date}: ${d.total}次`);

    // X axis
    const xAxis = g.append('g').attr('transform', `translate(0,${ih})`).call(d3.axisBottom(x).tickValues(data.filter((_, i) => i % 5 === 0).map(d => d.date.slice(5))));
    xAxis.selectAll('text').attr('fill', '#8f959e').attr('font-size', '10px');
    xAxis.select('.domain').remove();
}

// ===== Publish =====
async function loadPublish() {
    try {
        const d = await api('/dashboard/api/publish?period=' + currentPeriod);
        document.getElementById('publishTotal').textContent = d.total || 0;
        document.getElementById('publishRate').textContent = '按时率 ' + (d.on_time_rate || 0) + '%';

        // Publish page stats
        document.getElementById('pubMonthTotal').textContent = d.total || 0;
        document.getElementById('pubSuccess').textContent = d.success || 0;
        const missed = (d.by_account || {}).total?.missed || 0;
        const pending = d.total - (d.success || 0) - missed;
        document.getElementById('pubMissed').textContent = missed;
        document.getElementById('pubPending').textContent = Math.max(0, pending);
        document.getElementById('pubOnTimeRate').textContent = d.on_time_rate || 0;
    } catch(e) { console.error(e); }
}

// ===== Analysis =====
async function loadAnalysis() {
    try {
        const d = await api('/dashboard/api/analysis');
        document.getElementById('analysisBooks').textContent = (d.total_books || 0) + ' 本';
        document.getElementById('analysisToday').textContent = '今日新增 ' + (d.today_added || 0) + ' 张卡片';

// ===== Memory =====
async function loadMemory() {
    try {
        const d = await api('/dashboard/api/memory');
        const days = d.memory.last_modified_days;
        const badge = document.getElementById('memoryBadge');
        badge.textContent = days <= 1 ? '正常' : days + '天前';
        badge.className = 'badge ' + (days <= 1 ? 'ok' : 'warn');

        const el = document.getElementById('memoryList');
        let html = `<div class="memory-item">
            <div class="memory-name">MEMORY.md<div class="sub">${d.memory.last_modified || '不存在'}</div></div>
            <span class="memory-badge ${days <= 1 ? 'badge-ok' : 'badge-warn'}">${days <= 1 ? '正常' : days + '天前'}</span>
        </div>`;
        (d.pending_logs || []).forEach(log => {
            html += `<div class="memory-item">
                <div class="memory-name">${escHtml(log.name)}<div class="sub">${log.days_ago}天前</div></div>
                <span class="memory-badge badge-warn">待整理</span>
            </div>`;

// ===== Projects & Sessions =====
async function loadProjects() {
    try {
        const d = await api('/dashboard/api/projects');
        const el = document.getElementById('quickLinks');
        el.innerHTML = d.projects.map(p =>
            `<a href="${p.url}" class="quick-link" target="_blank">${p.icon} ${escHtml(p.name)}</a>`
        ).join('');
    } catch(e) { console.error(e); }
}

async function loadSessions() {
    try {
        const resp = await api('/dashboard/api/sessions');
        const resp2 = await api('/dashboard/api/stats?period=day');
        const sessions = resp.sessions || [];

        const active = sessions.filter(s => s.status === 'active').length;
        const running = sessions.filter(s => s.status === 'running').length;
        const idle = sessions.filter(s => s.status === 'idle').length;

        document.getElementById('sessTotal').textContent = sessions.length;
        document.getElementById('sessActive').textContent = active;
        document.getElementById('sessRunning').textContent = running;
        document.getElementById('sessIdle').textContent = idle;

        const remaining = 600 - (resp2.window_calls || 0);
        document.getElementById('sessWindow').textContent = remaining + ' 条';

        const detailEl = document.getElementById('sessionsDetail');
        if (sessions.length === 0) {
            detailEl.innerHTML = '<div class="no-data">暂无活跃会话</div>';
        } else {
            detailEl.innerHTML = sessions.map(s => {
                const dotClass = s.status === 'active' ? 'dot-active' : s.status === 'running' ? 'dot-running' : 'dot-idle';
                const statusText = s.status === 'active' ? '活跃' : s.status === 'running' ? '执行中' : '空闲';
                return `<div class="session-item">
                    <span class="session-dot ${dotClass}"></span>
                    <span class="session-name">${escHtml(s.label || s.session_key || '未知')}</span>
                    <span class="session-meta">${statusText} · ${s.last_active || '-'}</span>
                </div>`;
            }).join('');
        }

        // 加载日历
        loadCalendar2(calendarYear, calendarMonth);
    } catch(e) {
        document.getElementById('sessionsDetail').innerHTML = '<div class="no-data">加载失败: ' + e.message + '</div>';
    }
}

function loadCalendar2(year, month) {
    api(`/dashboard/api/publish/calendar?year=${year}&month=${month}`).then(d => {
        document.getElementById('calendarMonth2').textContent = `${year}年${month}月`;
        calendarData = {};
        (d.tasks || []).forEach(t => { if (!calendarData[t.day]) calendarData[t.day] = []; calendarData[t.day].push(t); });

        const grid = document.getElementById('calendarGrid2');
        grid.innerHTML = '';
        const firstDay = new Date(year, month - 1, 1).getDay();
        const startOffset = firstDay === 0 ? 6 : firstDay - 1;
        const lastMonthDays = new Date(year, month - 1, 0).getDate();
        const today = new Date();
        const isCurrentMonth = today.getFullYear() === year && today.getMonth() + 1 === month;
        const todayDay = today.getDate();

        for (let i = startOffset - 1; i >= 0; i--) {
            grid.innerHTML += `<div class="cal-day other-month"><span class="day-num">${lastMonthDays - i}</span></div>`;
        }
        for (let day = 1; day <= d.days_in_month; day++) {
            const tasks = calendarData[day] || [];
            const isToday = isCurrentMonth && day === todayDay;
            let dots = '';
            if (tasks.length > 0) {
                const statuses = [...new Set(tasks.map(t => t.status))].slice(0, 3);
                dots = `<div class="dots">${statuses.map(s => `<span class="dot dot-${s === 'success' ? 'success' : s === 'missed' ? 'missed' : 'pending'}"></span>`).join('')}</div>`;
            }
            grid.innerHTML += `<div class="cal-day ${isToday ? 'today' : ''}" data-day="${day}" onclick="selectDay2(${day})"><span class="day-num">${day}</span>${dots}</div>`;
        }
        const filled = startOffset + d.days_in_month;
        for (let i = 1; i <= 42 - filled; i++) {
            grid.innerHTML += `<div class="cal-day other-month"><span class="day-num">${i}</span></div>`;
        }
    });
}

function selectDay2(day) {
    document.querySelectorAll('#calendarGrid2 .cal-day').forEach(el => el.classList.remove('selected'));
    const el = document.querySelector(`#calendarGrid2 .cal-day[data-day="${day}"]`);
    if (el) el.classList.add('selected');
    // No detail panel in sessions page, just highlight
}

async function loadSysStatus() {
    try {
        const d = await api('/dashboard/api/system');
        const el = document.getElementById('sysStatusList');
        const items = d.items || [];
        const statusOrder = { ok: 0, warn: 1, error: 2 };
        const overall = items.reduce((worst, item) => {
            const s = statusOrder[item.status] > statusOrder[worst] ? item.status : worst;
            return s;
        }, 'ok');
        const overallEl = document.getElementById('sysOverall');
        overallEl.textContent = overall === 'ok' ? '正常' : overall === 'warn' ? '警告' : '异常';
        overallEl.className = 'stat-value ' + (overall === 'ok' ? 'green' : overall === 'warn' ? 'amber' : 'red');
        document.getElementById('sysStatus').textContent = items.length + ' 项检查';

        el.innerHTML = items.map(item => `
            <div class="sys-item">
                <span class="sys-name">${escHtml(item.name)}</span>
                <span class="sys-value ${item.status}">${item.status === 'ok' ? '✓ 正常' : item.status === 'warn' ? '⚠ ' + item.message : '✗ ' + item.message}</span>
            </div>
        `).join('');
    } catch(e) {
        // Fallback with basic checks
        const items = [];
        try {
            const resp = await api('/dashboard/api/stats?period=day');
            const remaining = 600 - (resp.window_calls || 0);
            items.push({ name: 'Token 窗口', status: remaining > 300 ? 'ok' : remaining > 100 ? 'warn' : 'error', message: remaining + ' 条剩余' });
        } catch(e2) {}
        try {
            const gal = await api('/dashboard/api/gallery-count');
            items.push({ name: '相册', status: 'ok', message: gal.count + ' 张照片' });
        } catch(e2) { items.push({ name: '相册', status: 'warn', message: '无法连接' }); }
        const overall = items.reduce((w, i) => statusOrder[i.status] > statusOrder[w] ? i.status : w, 'ok');
        document.getElementById('sysOverall').textContent = overall === 'ok' ? '正常' : '⚠ 警告';
        document.getElementById('sysStatus').textContent = items.length + ' 项';
        const el = document.getElementById('sysStatusList');
        el.innerHTML = items.map(item => `
            <div class="sys-item">
                <span class="sys-name">${escHtml(item.name)}</span>
                <span class="sys-value ${item.status}">${item.message}</span>
            </div>
        `).join('');
    }
}

// ===== Activity =====
async function loadActivity() {
    try {
        const d = await api('/dashboard/api/activity');
        const el = document.getElementById('activityList');
        if (!d.timeline || d.timeline.length === 0) { el.innerHTML = '<div class="no-data">今日暂无活动</div>'; return; }
        const max = Math.max(...d.timeline.map(t => t.count));
        el.innerHTML = d.timeline.map(t => `
            <div class="activity-item">
                <span class="activity-hour">${t.hour}</span>
                <div class="activity-bar-wrap"><div class="activity-bar" style="width:${(t.count/max*100).toFixed(1)}%"></div></div>
                <span class="activity-count">${t.count}次</span>
            </div>
        `).join('');
    } catch(e) { console.error(e); }
}

// ===== Calendar =====
async function loadCalendar(year, month) {
    try {
        const d = await api(`/dashboard/api/publish/calendar?year=${year}&month=${month}`);
        document.getElementById('calendarMonth').textContent = `${year}年${month}月`;
        calendarData = {};
        (d.tasks || []).forEach(t => { if (!calendarData[t.day]) calendarData[t.day] = []; calendarData[t.day].push(t); });

        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';
        const firstDay = new Date(year, month - 1, 1).getDay();
        const startOffset = firstDay === 0 ? 6 : firstDay - 1;
        const lastMonthDays = new Date(year, month - 1, 0).getDate();
        const today = new Date();
        const isCurrentMonth = today.getFullYear() === year && today.getMonth() + 1 === month;
        const todayDay = today.getDate();

        for (let i = startOffset - 1; i >= 0; i--) {
            grid.innerHTML += `<div class="cal-day other-month"><span class="day-num">${lastMonthDays - i}</span></div>`;
        }
        for (let day = 1; day <= d.days_in_month; day++) {
            const tasks = calendarData[day] || [];
            const isToday = isCurrentMonth && day === todayDay;
            let dots = '';
            if (tasks.length > 0) {
                const statuses = [...new Set(tasks.map(t => t.status))].slice(0, 3);
                dots = `<div class="dots">${statuses.map(s => `<span class="dot dot-${s === 'success' ? 'success' : s === 'missed' ? 'missed' : 'pending'}"></span>`).join('')}</div>`;
            }
            grid.innerHTML += `<div class="cal-day ${isToday ? 'today' : ''}" data-day="${day}" onclick="selectDay(${day})"><span class="day-num">${day}</span>${dots}</div>`;
        }
        const filled = startOffset + d.days_in_month;
        for (let i = 1; i <= 42 - filled; i++) {
            grid.innerHTML += `<div class="cal-day other-month"><span class="day-num">${i}</span></div>`;
        }
    } catch(e) { console.error(e); }
}

function selectDay(day) {
    document.querySelectorAll('.cal-day').forEach(el => el.classList.remove('selected'));
    const el = document.querySelector(`.cal-day[data-day="${day}"]`);
    if (el) el.classList.add('selected');
    document.getElementById('closeDetailBtn').style.display = '';
    const tasks = calendarData[day] || [];
    document.getElementById('detailDayTitle').textContent = `${calendarYear}年${calendarMonth}月${day}日`;
    if (tasks.length === 0) {
        document.getElementById('detailBody').innerHTML = '<div class="day-empty">无发布任务</div>';
        return;
    }
    document.getElementById('detailBody').innerHTML = tasks.map(t => {
        const color = t.status === 'success' ? '#07c160' : t.status === 'missed' ? '#ef4444' : '#f59e0b';
        const text = t.status === 'success' ? '✓ 已发布' : t.status === 'missed' ? '✗ 漏发' : '○ 待发布';
        const time = t.timestamp ? new Date(t.timestamp).toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'}) : '-';
        const btn = t.status !== 'success' ? `<button class="mark-btn" onclick="markPublished('${escHtml(t.account)}', ${day})">✓ 标记已发布</button>` : '';
        return `<div class="day-task">
            <span class="day-task-dot" style="background:${color}"></span>
            <span class="day-task-name">${escHtml(t.account)}</span>
            <span class="day-task-meta">${text} ${time}</span>
            ${btn}
        </div>`;
    }).join('');
}

async function markPublished(account, day) {
    if (!confirm(`确认将「${account}」标记为已发布？`)) return;
    try {
        await fetch('/dashboard/api/publish/log', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ account, status: 'success', note: `手动标记 ${calendarYear}-${String(calendarMonth).padStart(2,'0')}-${String(day).padStart(2,'0')}` })
        });
        if (calendarData[day]) {
            calendarData[day].forEach(t => { if (t.account === account) { t.status = 'success'; t.timestamp = new Date().toISOString(); }});
        }
        selectDay(day);
    } catch(e) { alert('标记失败: ' + e.message); }
}

function closeDetail() {
    document.querySelectorAll('.cal-day').forEach(el => el.classList.remove('selected'));
    document.getElementById('detailDayTitle').textContent = '点击日期查看';
    document.getElementById('detailBody').innerHTML = '<div class="day-empty">点击左侧日历上的日期<br>查看当天发布详情</div>';
    document.getElementById('closeDetailBtn').style.display = 'none';
}

function changeMonth(delta) {
    calendarMonth += delta;
    if (calendarMonth > 12) { calendarMonth = 1; calendarYear++; }
    if (calendarMonth < 1) { calendarMonth = 12; calendarYear--; }
    // Overview calendar
    loadCalendarOverview(calendarYear, calendarMonth);
    // Sessions calendar
    loadCalendar2(calendarYear, calendarMonth);
}

// ===== Page / Period switching =====
function setPage(p) {
    currentPage = p;
    document.querySelectorAll('.page-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.page-tab')[p === 'overview' ? 0 : p === 'usage' ? 1 : 2].classList.add('active');
    document.querySelectorAll('[id^=page-]').forEach(el => el.style.display = 'none');
    document.getElementById('page-' + p).style.display = 'block';
    document.getElementById('periodTabs').style.display = (p === 'overview' || p === 'usage') ? 'flex' : 'none';
    if (p === 'overview') { loadAll(); }
    else if (p === 'usage') { loadStats(); loadBarChart(); loadActivity(); loadSysStatus(); }
    else if (p === 'sessions') { loadSessions(); }
}

function setPeriod(p) {
    currentPeriod = p;
    document.querySelectorAll('.period-tab').forEach(t => t.classList.toggle('active', t.dataset.period === p));
    loadStats();
    loadPublish();
}

function escHtml(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Init
const now = new Date();
calendarYear = now.getFullYear();
calendarMonth = now.getMonth() + 1;
loadAll();
setInterval(() => { if (currentPage === 'overview') loadAll(); }, 60000);
</script>
