<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人知识管理 - 本地备份</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #ffffff;
            color: #1f2329;
            font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
            font-size: 15px;
            line-height: 1.7;
            padding: 40px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        
        /* 标题区 */
        .page-header { margin-bottom: 32px; border-bottom: 1px solid #e5e7eb; padding-bottom: 20px; }
        .page-title { font-size: 22px; font-weight: 600; color: #1f2329; margin-bottom: 4px; }
        .page-subtitle { font-size: 13px; color: #8f959e; }
        
        /* 操作提示 */
        .tips { background: #f7f8fa; border-radius: 8px; padding: 12px 16px; margin-bottom: 24px; font-size: 13px; color: #646a73; }
        
        /* 文档列表 */
        .doc-list { display: grid; gap: 12px; }
        .doc-item {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: box-shadow 0.2s;
        }
        .doc-item:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .doc-icon { font-size: 28px; flex-shrink: 0; }
        .doc-info { flex: 1; min-width: 0; }
        .doc-tag { font-size: 16px; font-weight: 600; color: #1f2329; margin-bottom: 2px; }
        .doc-meta { font-size: 12px; color: #8f959e; }
        .doc-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .doc-btn {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 6px 12px; border-radius: 6px; font-size: 13px;
            text-decoration: none; cursor: pointer; border: none;
            transition: background 0.2s;
        }
        .doc-btn-view {
            background: #07c160; color: #fff;
        }
        .doc-btn-view:hover { background: #06a555; }
        .doc-btn-delete {
            background: #fff; color: #dc2626; border: 1px solid #fecaca;
        }
        .doc-btn-delete:hover { background: #fef2f2; }
        
        /* 空白状态 */
        .empty { text-align: center; padding: 60px 20px; color: #8f959e; }
        .empty-icon { font-size: 48px; margin-bottom: 12px; }
        
        /* 删除确认弹窗 */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 1000;
            justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: #fff; border-radius: 12px; padding: 24px;
            max-width: 360px; width: 90%; text-align: center;
        }
        .modal-icon { font-size: 40px; margin-bottom: 12px; }
        .modal-title { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
        .modal-desc { font-size: 14px; color: #646a73; margin-bottom: 20px; }
        .modal-actions { display: flex; gap: 10px; justify-content: center; }
        .modal-cancel {
            padding: 8px 20px; border-radius: 6px; font-size: 14px;
            background: #f3f4f6; color: #1f2329; border: none; cursor: pointer;
        }
        .modal-confirm {
            padding: 8px 20px; border-radius: 6px; font-size: 14px;
            background: #dc2626; color: #fff; border: none; cursor: pointer;
        }
        .modal-confirm:hover { background: #b91c1c; }
        
        /* 响应式 */
        @media (max-width: 600px) {
            body { padding: 20px; }
            .doc-item { flex-direction: column; align-items: flex-start; }
            .doc-actions { width: 100%; }
            .doc-btn { flex: 1; justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1 class="page-title">📚 个人知识管理</h1>
            <div class="page-subtitle">本地备份 · http://192.168.31.194/visit/</div>
        </div>
        
        <div class="tips">
            💡 本地备份与飞书文档同步生成，删除本地备份不会影响飞书原文档。
        </div>
        
        <div id="docList" class="doc-list">
            {% if docs %}
            {% for doc in docs %}
            <div class="doc-item" id="item-{{ doc.tag }}">
                <div class="doc-icon">📄</div>
                <div class="doc-info">
                    <div class="doc-tag">{{ doc.tag }}</div>
                    <div class="doc-meta">本地备份</div>
                </div>
                <div class="doc-actions">
                    <a href="/visit/doc/{{ doc.filename }}" class="doc-btn doc-btn-view">查看</a>
                    <button class="doc-btn doc-btn-delete" onclick="confirmDelete('{{ doc.tag }}')">删除</button>
                </div>
            </div>
            {% endfor %}
            {% else %}
            <div class="empty">
                <div class="empty-icon">📭</div>
                <div>暂无本地备份文档</div>
                <div style="font-size:12px;margin-top:8px">使用「开始生成」后会同时创建本地备份</div>
            </div>
            {% endif %}
        </div>
    </div>
    
    <!-- 删除确认弹窗 -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal-box">
            <div class="modal-icon">🗑️</div>
            <div class="modal-title">确认删除</div>
            <div class="modal-desc" id="deleteModalDesc">确定要删除这篇本地备份吗？</div>
            <div class="modal-actions">
                <button class="modal-cancel" onclick="closeModal()">取消</button>
                <button class="modal-confirm" id="confirmDeleteBtn" onclick="doDelete()">删除</button>
            </div>
        </div>
    </div>
    
    <!-- 结果提示弹窗 -->
    <div class="modal-overlay" id="resultModal">
        <div class="modal-box">
            <div class="modal-icon" id="resultIcon">✅</div>
            <div class="modal-title" id="resultTitle">已删除</div>
            <div class="modal-desc" id="resultDesc"></div>
            <div class="modal-actions">
                <button class="modal-cancel" onclick="closeResultModal()">好的</button>
            </div>
        </div>
    </div>
    
    <script>
        let pendingDeleteTag = null;
        
        function confirmDelete(tag) {
            pendingDeleteTag = tag;
            document.getElementById('deleteModalDesc').textContent = '删除「' + tag + '」的本地备份？此操作不可恢复。';
            document.getElementById('deleteModal').classList.add('active');
        }
        
        function closeModal() {
            document.getElementById('deleteModal').classList.remove('active');
            pendingDeleteTag = null;
        }
        
        function closeResultModal() {
            document.getElementById('resultModal').classList.remove('active');
        }
        
        async function doDelete() {
            if (!pendingDeleteTag) return;
            const tag = pendingDeleteTag;
            closeModal();
            
            try {
                const resp = await fetch(`/visit/api/delete/${encodeURIComponent(tag)}`, {
                    method: 'POST'
                });
                const data = await resp.json();
                
                if (data.success) {
                    // 从列表移除
                    const item = document.getElementById('item-' + tag);
                    if (item) item.remove();
                    
                    document.getElementById('resultIcon').textContent = '✅';
                    document.getElementById('resultTitle').textContent = '已删除';
                    document.getElementById('resultDesc').textContent = `「${tag}」本地备份已删除。`;
                    
                    // 检查列表是否空了
                    const list = document.getElementById('docList');
                    if (list && list.querySelectorAll('.doc-item').length === 0) {
                        list.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><div>暂无本地备份文档</div><div style="font-size:12px;margin-top:8px">使用「开始生成」后会同时创建本地备份</div></div>';
                    }
                } else {
                    document.getElementById('resultIcon').textContent = '❌';
                    document.getElementById('resultTitle').textContent = '删除失败';
                    document.getElementById('resultDesc').textContent = data.error || '未知错误';
                }
            } catch(e) {
                document.getElementById('resultIcon').textContent = '❌';
                document.getElementById('resultTitle').textContent = '请求失败';
                document.getElementById('resultDesc').textContent = String(e);
            }
            
            document.getElementById('resultModal').classList.add('active');
            pendingDeleteTag = null;
        }
        
        // 点击弹窗外部关闭
        document.getElementById('deleteModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        document.getElementById('resultModal').addEventListener('click', function(e) {
            if (e.target === this) closeResultModal();
        });
    </script>
</body>
</html>
