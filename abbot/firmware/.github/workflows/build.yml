name: 编译固件

on:
  # 推 main 即自动编译 —— 固件产出不该依赖"记得手动点一下"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release 标签（留空则用 fw-<短SHA>）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # 保留凭据, 后面推 fw-bin / ci-logs 分支时用得上
          persist-credentials: true

      - name: 允许 git 读取工作区
        run: git config --global --add safe.directory '*'

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      # 只缓存下载体积大的包，不缓存 ~/.platformio/penv。
      # penv 是 PlatformIO 自己的虚拟环境，shebang 写死创建时的 Python 路径，
      # Python 补丁号一变就 bad interpreter，命令直接 126 失败。
      - name: 缓存 PlatformIO 包
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-pkg-${{ hashFiles('platformio.ini') }}-py3.11.9

      # PlatformIO Core 必须钉在 6.1.18。
      # 6.2.0 会带 SCons 4.11+，SCons 4.11 起 ${func(args)} 要求被调函数
      # 接受 target/source/env/for_signature 关键字参数，而 espressif32 的
      # __get_board_flash_mode(env) 不匹配 -> 替换返回 SCons 的 _Null 哨兵 ->
      # elf2image 那步 print_cmd_line 里 _Null + str 抛 TypeError。
      - name: 装 PlatformIO
        run: |
          set +e
          rm -rf ~/.platformio/penv
          python -m pip install --upgrade pip
          python -m pip install --upgrade 'platformio==6.1.18'
          pio --version

      # 主机侧向量测试：固件的端云信封实现必须与服务端逐字节一致
      # （doc/05 §3.4 锁定向量 + NIST SP 800-38A F.5.1 官方向量）。
      # 这一步在编译之前跑 —— 信封跑偏的固件编出来也没意义。
      - name: 主机侧向量测试（端云信封）
        working-directory: .
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq libmbedtls-dev
          gcc -Wall -Wextra -Werror -I include -I src \
              test/test_net_client.c src/net/net_client.c \
              -o /tmp/test_net_client -lmbedtls -lmbedcrypto
          /tmp/test_net_client
          # 设备端请求层（明文组装 / URL / HTTP 响应解析）——纯 C，同样主机侧可测
          gcc -Wall -Wextra -Werror -I include -I src \
              test/test_net_req.c src/net/net_req.c src/net/net_client.c \
              -o /tmp/test_net_req -lmbedtls -lmbedcrypto
          /tmp/test_net_req
          # 网络调度层路由测试（纯 C，桩实现验证 op -> 端点 的映射）
          gcc -Wall -Wextra -Werror -I include -I src \
              test/test_net_dispatch.c src/net/net_dispatch.c \
              -o /tmp/test_net_dispatch
          /tmp/test_net_dispatch
          # UI 数据层（TF 卡读卡 + UTF-8 分页 + 课表解析）——纯 C，自带假存储任务
          gcc -Wall -Wextra -Werror -I test/host_stubs -I include -I src \
              test/test_ui_data.c src/ui/ui_data.c \
              -o /tmp/test_ui_data
          /tmp/test_ui_data
          # 电子书阅读护栏（阅读进度 + 宵禁 + 每日上限）——纯 C，主机侧可测
          gcc -Wall -Wextra -Werror -I test/host_stubs -I include -I src \
              test/test_ui_book_guard.c src/ui/ui_book_guard.c \
              -o /tmp/test_ui_book_guard
          /tmp/test_ui_book_guard
          # 离线队列（outbox）——纯 C，自带假存储任务
          gcc -Wall -Wextra -Werror -I test/host_stubs -I include -I src \
              test/test_outbox.c src/net/outbox.c \
              -o /tmp/test_outbox
          /tmp/test_outbox
          # 学科卡片包（cards）——纯 C，自带假存储任务
          # 含 doc/05 §3.4 的官方锁定向量（cards.enc 局部块偏移解密）
          gcc -Wall -Wextra -Werror -I test/host_stubs -I include -I src \
              test/test_cards.c src/net/cards.c src/net/net_client.c \
              -o /tmp/test_cards -lmbedtls -lmbedcrypto -lz
          /tmp/test_cards
          # Wi-Fi 扫描结果解析 + 连接状态机（排序 / 去重 / 信号分级 / 重试）—— 纯 C，主机侧可测
          gcc -Wall -Wextra -Werror -I include -I src \
              test/test_wifi_model.c src/net/wifi_model.c \
              -o /tmp/test_wifi_model
          /tmp/test_wifi_model
          # 虚拟键盘编辑逻辑（输入 / 退格 / 空格 / 光标 / 大小写 / 掩码）—— 纯 C，主机侧可测
          gcc -Wall -Wextra -Werror -I include -I src \
              test/test_keypad.c src/ui/keypad_editor.c \
              -o /tmp/test_keypad
          /tmp/test_keypad
          # Arduino 层（net_api.cpp）的语法检查 —— 用 stub 头在主机上跑。
          # 这一步不替代下面的 PlatformIO 固件编译：它只是让「一轮只暴露一个
          # 编译错误」变成「一轮暴露全部」，省掉反复试错。
          # OTA 客户端（三重校验原语 / 版本比较 / 分区容量）—— 纯 C，主机侧可测
          gcc -Wall -Wextra -Werror -I include -I src \
              test/test_ota.c src/net/ota_client.c src/net/net_client.c \
              -o /tmp/test_ota -lmbedtls -lmbedcrypto
          /tmp/test_ota
          bash test/host_check_arduino.sh

      - name: 编译固件
        working-directory: .
        run: |
          set +e
          {
            echo '### pio 版本'
            pio --version
            echo
            echo '### platformio.ini'
            cat platformio.ini
            echo
            echo '### pio run -v'
          } > build.log
          pio run -v 2>&1 | tee -a build.log
          rc=${PIPESTATUS[0]}
          echo "PIORC=$rc" | tee -a build.log
          exit $rc

      - name: 提取编译错误
        if: always()
        working-directory: .
        run: |
          set +e
          echo "日志字节数: $(wc -c < build.log)"
          echo '### 错误行'
          grep -hn -iE 'error:|fatal error|undefined reference|no such file|bad interpreter|command not found|Traceback|TypeError' build.log \
            | grep -viE 'Node\.js 20 is deprecated|deprecat' \
            | head -20 | while IFS= read -r l; do
                esc=$(printf '%s' "$l" | sed -e 's/%/%25/g' -e 's/\r//g' | cut -c1-400)
                echo "::error::$esc"
              done
          echo '### 日志尾 20 行'
          tail -20 build.log | while IFS= read -r l; do
              esc=$(printf '%s' "$l" | sed -e 's/%/%25/g' -e 's/\r//g' | cut -c1-300)
              echo "::notice::$esc"
            done

      # 查清一个关键事实：**Arduino ESP32 核心会不会在 setup() 之后自动调
      # esp_ota_mark_app_valid_cancel_rollback()**。
      # 若核心自动标记为 VALID，「新固件崩溃 -> 重启 -> 引导器回滚」这条保护就失效了。
      #
      # 本机没有 PlatformIO（硬线：不许为读它去装），也拉不到 Actions 日志
      # （blob 被出口代理挡 403）—— 所以这一步在 CI 里把框架源码里相关的行
      # 抓出来，写进 ci-logs 分支，本机从 git 通道读。
      - name: 探测框架的 OTA 自动标记行为
        if: always()
        working-directory: .
        run: |
          set +e
          FW="$HOME/.platformio/packages/framework-arduinoespressif32"
          F="$FW/cores/esp32/main.cpp"
          SDK="$FW/tools/sdk/esp32s3/sdkconfig"
          {
            echo "### 框架 package.json"
            head -20 "$FW/package.json" 2>/dev/null
            echo
            echo "### main.cpp 里与 OTA / 回滚 / 标记有效相关的全部行"
            grep -n -i -E 'ota|rollback|mark_app_valid|pending_verify|verify' "$F" 2>/dev/null
            echo
            echo "### main.cpp 全文"
            cat "$F" 2>/dev/null
            echo
            echo "### sdkconfig 里的回滚开关"
            grep -n -E 'APP_ROLLBACK|APP_ANTI_ROLLBACK' "$SDK" 2>/dev/null
            echo
            echo "### esp_ota_ops.h 是否存在"
            ls -l "$FW/tools/sdk/esp32s3/include/esp_system/include/esp_ota_ops.h" 2>/dev/null
          } > framework-ota-probe.txt
          echo "探针输出 $(wc -c < framework-ota-probe.txt) 字节"
          grep -n -i -E 'mark_app_valid|rollback|pending_verify' framework-ota-probe.txt | head -20

      # 产物清单 —— 收集 build 目录里真实存在的文件。
      #
      # 上一轮在这里栽过：固件产物文件名是硬编码的 5 个，其中 boot_app0.bin
      # 是 ESP-IDF 的产物，Arduino 框架根本不生成它 -> git hash-object 找不到
      # 文件 -> 推 fw-bin 分支那一步当场失败，而错误只写在本机拉不到的
      # step log 里，看不见也修不了。
      #
      # 现在改成 glob 收集实际存在的文件 + 写 manifest.txt。
      # manifest.txt 永远回写 ci-logs 分支（见末尾那一步），
      # 于是「产物到底叫什么、有多大」这件事由 CI 自证，不用猜。
      - name: 收集固件产物
        id: collect
        if: success()
        working-directory: .
        run: |
          set -e
          B=.pio/build/esp32s3
          rm -rf dist && mkdir -p dist
          {
            echo "### build 目录内容"
            ls -la "$B" || true
            echo
            echo "### 收集到的产物"
          } > dist/manifest.txt
          cnt=0
          for f in "$B"/*.bin; do
            [ -e "$f" ] || continue
            cp "$f" dist/
            echo "  $(basename "$f")  $(wc -c < "$f") 字节" >> dist/manifest.txt
            cnt=$((cnt+1))
          done
          if [ -f "$B/flash_args.txt" ]; then
            cp "$B/flash_args.txt" dist/
            echo "  flash_args.txt  $(wc -c < "$B/flash_args.txt") 字节" >> dist/manifest.txt
          fi
          echo "  共 $cnt 个 bin" >> dist/manifest.txt
          echo
          echo "### sha256" >> dist/manifest.txt
          (cd dist && sha256sum *.bin flash_args.txt 2>/dev/null || true) >> dist/manifest.txt
          cat dist/manifest.txt
          # 固件本体必须有 —— 少了它这个 Release 没意义
          if [ ! -f dist/firmware.bin ]; then
            echo "::error::没有 dist/firmware.bin —— Arduino 框架的产物名可能变了"
            echo "没有 dist/firmware.bin" >> dist/manifest.txt
            exit 1
          fi

      # 固件产物推到 fw-bin 分支 —— git 通道在受限网络下比 artifact 下载更稳。
      - name: 把固件产物推到分支
        id: push_fwbin
        if: success()
        env:
          SHA: ${{ github.sha }}
          BRANCH: fw-bin
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: .
        run: |
          set -e
          git config user.name 'ci'
          git config user.email 'ci@local'
          BASE=''
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            git fetch --depth 1 origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            BASE=$(git rev-parse "refs/remotes/origin/$BRANCH")
          fi
          TMPIDX=$(mktemp)
          export GIT_INDEX_FILE=$TMPIDX
          if [ -n "$BASE" ]; then git read-tree "$BASE^{tree}"; else git read-tree --empty; fi
          # 推 dist/ 里实际存在的全部文件（含 manifest.txt），不做文件名假设
          for f in dist/*; do
            [ -f "$f" ] || continue
            BLOB=$(git hash-object -w "$f")
            git update-index --add --cacheinfo 100644,$BLOB,"$(basename "$f")"
          done
          TREE=$(git write-tree)
          # 首次推送（分支还不存在）时不能带 -p：git commit-tree 的父提交必须是
          # commit 对象，空树对象会被拒（"is not a valid 'commit' object"）。
          if [ -n "$BASE" ]; then
            C=$(git commit-tree "$TREE" -p "$BASE" -m "fw $SHA")
          else
            C=$(git commit-tree "$TREE" -m "fw $SHA")
          fi
          git update-ref "refs/heads/$BRANCH" "$C"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
                 "refs/heads/$BRANCH:refs/heads/$BRANCH"

      - name: 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: abbot-firmware
          path: dist/
          if-no-files-found: error

      # 建 Release —— 必须在推 fw-bin 之后，且 gh 需要 GH_TOKEN 才有鉴权。
      # 上一轮这里没设 GH_TOKEN，gh release create 必然鉴权失败。
      - name: 建 Release
        if: success()
        env:
          SHA: ${{ github.sha }}
          TAG: ${{ inputs.release_tag || format('fw-{0}', github.sha) }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: .
        run: |
          set -e
          FILES=$(ls dist/*.bin dist/flash_args.txt 2>/dev/null || true)
          gh release create "$TAG" $FILES \
            --title "$TAG" --notes "abbot ESP32-S3 固件（提交 $SHA）"

      # 记录这轮所有步骤的结论 —— 写进 ci-logs 后，本机不拉 Actions 日志也能知道
      # 到底是哪一步挂的（上一轮栽在"看不见失败原因"上）。
      # 必须排在回写之前，否则 steps.txt 生成得太晚，进不了 ci-logs。
      - name: 记录步骤结论
        if: always()
        working-directory: .
        run: |
          set +e
          {
            echo "commit: ${{ github.sha }}"
            echo "run:    ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "steps:"
            echo '${{ toJSON(steps) }}'
          } > steps.txt
          head -40 steps.txt

      # 把日志与清单回写到 ci-logs 分支。
      #
      # 本机拉不到 Actions 的 logs/artifacts（blob 存储被出口代理挡，403），
      # git 通道能通 —— 这与 fw-bin 分支取固件产物是同一条思路。
      #
      # 这一步 always() 跑：成功时也回写，这样「产物清单」和「完整编译日志」
      # 永远可查，失败时不用靠猜。
      - name: 回写日志与清单到 ci-logs 分支
        if: always()
        env:
          SHA: ${{ github.sha }}
          BRANCH: ci-logs
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: .
        run: |
          set +e
          git config user.name 'ci'
          git config user.email 'ci@local'
          BASE=''
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            git fetch --depth 1 origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            BASE=$(git rev-parse "refs/remotes/origin/$BRANCH")
          fi
          TMPIDX=$(mktemp)
          export GIT_INDEX_FILE=$TMPIDX
          if [ -n "$BASE" ]; then git read-tree "$BASE^{tree}"; else git read-tree --empty; fi
          # 回写三样东西：编译日志、产物清单、以及这轮的所有步骤结论
          for f in build.log dist/manifest.txt steps.txt framework-ota-probe.txt; do
            [ -f "$f" ] || continue
            case "$f" in
              build.log)  NAME="build-$SHA.log" ;;
              dist/manifest.txt) NAME="manifest-$SHA.txt" ;;
              framework-ota-probe.txt) NAME="framework-ota-probe.txt" ;;
              *)          NAME="steps-$SHA.txt" ;;
            esac
            BLOB=$(git hash-object -w "$f")
            git update-index --add --cacheinfo 100644,$BLOB,"$NAME"
          done
          TREE=$(git write-tree)
          if [ -n "$BASE" ]; then
            C=$(git commit-tree "$TREE" -p "$BASE" -m "ci log $SHA")
          else
            C=$(git commit-tree "$TREE" -m "ci log $SHA")
          fi
          git update-ref "refs/heads/$BRANCH" "$C"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
                 "refs/heads/$BRANCH:refs/heads/$BRANCH"
