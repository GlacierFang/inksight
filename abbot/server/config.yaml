# 05 §2.2 规定：模型路由、ASR/TTS 配置、配额与 OTA 策略热配置文件（权限 0600）
# 严禁在代码中硬编码厂商或模型名 —— 一律由此文件驱动，支持热重载。
# 敏感信息（API Key、管理员密码）放同目录 .env，不写在本文件。

server:
  # 只监听本机：对外只经 nginx 反代（/abbot/ 前缀），不直接暴露到局域网
  host: "127.0.0.1"
  port: 18843
  # 对外可达基址（含挂载前缀）。设备端拿到的下载地址必须是绝对 URL，
  # 否则设备端要自己拼 base，容易出错。域名与前缀一律由此文件驱动，禁止硬编码。
  public_base_url: "http://ruohan.site/abbot"
  # 静态管理台挂载点（零构建单文件 web/index.html）
  web_dir: "web"
  # storage/ 持久化目录（相对路径按 server/ 解析）
  storage_dir: "storage"

ai:
  # 三级意图分流：第一级本地规则直出，第二级轻量云端，第三级大模型推理
  # provider 可选：minimax（真实服务商）/ mock（本地联调占位，不调外部服务）
  # 生产部署必须改为真实服务商；mock 仅用于无网络/无密钥时的联调自检。
  provider: "minimax"
  base_url: "https://api.minimaxi.com"
  # 第二级轻量云端：纯文本模型
  text_model: "MiniMax-M2.5"
  # 第三级多模态推理：**该服务商的模型清单里没有独立视觉模型**（VL 系列已下架），
  # 但 M3 / M3.1-Flash 原生接受 image_url 输入并能正确识别画面内容（实测能准确
  # 描述照片里的物体、数量与位置），因此视觉档位直接用 M3，不要写 VL 模型名。
  #
  # 注意：图片若被内容审核拦下，上游会**静默剥离图像**并返回 200，
  # 模型只会回「我没有看到图片」—— 不是格式错，也不会报错。
  vision_model: "MiniMax-M3"
  # 请求路径（配置驱动，代码不硬编码厂商路由）
  text_path: "/v1/text/chatcompletion_v2"
  vision_path: "/v1/text/chatcompletion_v2"
  # 单次生成上限。M3 是带推理的模型，思考 token 与输出 token 共享这个额度，
  # 拍题导学要求返回严格 JSON，给小了会在 JSON 生成到一半被截断。
  max_tokens: 8192
  timeout_seconds: 60
  max_concurrency_per_device: 1

speech:
  asr:
    enabled: true
    provider: "minimax"
    base_url: "https://api.minimaxi.com"
    # 该服务商的转写端点是 speech_to_text（下划线），且**不支持裸 PCM**，
    # 必须是带容器的 wav/mp3 等 —— 网关已在 speech_engine 里把 PCM 封装成 WAV 头再上传。
    path: "/v1/speech_to_text"
    model: "asr-1.0"
    # 语言提示（BCP-47 请求头，不传则自动混合语种识别）
    language: "zh"
    timeout_seconds: 20
  tts:
    enabled: true
    provider: "minimax"
    base_url: "https://api.minimaxi.com"
    path: "/v1/t2a_v2"
    model: "speech-02-hd"
    voice_id: "male-qn-qingse"
    timeout_seconds: 30
    # 返回格式：hex | base64 | url —— 05 §4.4 要求按 Hex 解码落盘，严禁误用 Base64
    response_format: "hex"

quota:
  # 每台设备每日深度导学次数上限（服务端账本是唯一真相源，见 05 §4.2）
  daily_limit: 10
  # 每日配额重置时刻（UTC+8 日期比对，见 05 §4.2）
  reset_timezone: "Asia/Shanghai"

ota:
  manifest_file: "manifest.json"
  # 固件魔数校验（05 §6.2：首字节 0xE9）
  magic: "e9"
  # 单个固件大小上限 3.9MB（适配 4MB app 分区）
  max_size_mb: 3.9
  # 保留最近 5 版
  keep_versions: 5
  # 分发策略：PAUSED / CANARY / ALL
  strategy: "ALL"
  # CANARY 策略下的灰度设备白名单
  canary_devices: []
  # 熔断：同一固件版本连续失败达到该次数即停止下发
  circuit_breaker_threshold: 3

weather:
  # 城市名（默认北京）。设备在心跳里上报城市后会覆盖这里 —— 覆盖值写在
  # storage/settings.json，不写进本文件，也不写进 .env。
  city: "Beijing"
  # 可选经纬度：填了就直接按坐标取，不再做地名解析；留空则按上面的城市名解析
  # latitude: 39.9042
  # longitude: 116.4074
  # 缓存有效期（秒），与 bootstrap 侧的 2 小时 TTL 对齐
  ttl_seconds: 7200
  # 抓取源开关：open-meteo（主）/ wttr（备）。按顺序尝试，全失败则保留旧缓存
  sources: ["open-meteo", "wttr"]

admin:
  username: "admin"
  # 密码走 .env 的 ADMIN_PASSWORD，不写在明文配置里
  session_ttl_seconds: 7200
